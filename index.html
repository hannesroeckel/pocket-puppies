<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e3bd8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket Puppies">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<meta name="description" content="A pocket-sized puppy to keep you company.">
<link rel="manifest" href="manifest.webmanifest">
<!-- THE HOME-SCREEN ICON. iOS does not reliably use manifest icons, and does not
     support SVG or data: URIs for them at all: without a raster apple-touch-icon
     it falls back to a SCREENSHOT OF THE PAGE, which on a canvas game is a
     picture of a half-drawn room. This link is the whole fix. Sized 180 for the
     @3x home screen; iOS applies its own squircle, so the file is full-bleed and
     deliberately not pre-rounded. Drawn in code — see tools/make-icons.html. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Pocket Puppies</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:#2a1c14;
       overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  /* reads the real safe-area insets back out into JS */
  #safeprobe{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
       padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:#f1d9b4;font-size:13px;letter-spacing:.12em;text-transform:uppercase;
       background:#2a1c14;transition:opacity .35s ease;}
  #boot.gone{opacity:0;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safeprobe"></div>
<div id="boot">Pocket Puppies</div>
<script type="module">
  import './src/main.js';
  /* the boot veil hides the first paint; one rAF after module eval is enough */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const b = document.getElementById('boot');
    if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 420); }
  }));
</script>
<noscript><p style="color:#f1d9b4;padding:24px">Pocket Puppies needs JavaScript.</p></noscript>
</body>
</html>
