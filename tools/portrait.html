<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>breed portrait — front view, no room</title>
<!--
  tools/portrait.html — THE FRONTAL DOG, ALONE, ON A FLAT FIELD.

  Built to answer "where can i find the shiba front view to use as reference for
  the shiba sheet?" — and the honest answer was NOWHERE: the dogs only exist as
  drawing code, and every render in review/ has the living room behind it, which
  is exactly what you cannot hand to an image model as a character reference.

  So this draws `dog/draw.js` straight onto a blank canvas at whatever size is
  asked for: no room, no rug, no wall, no props. One dog, flat background, big.

  It is a TOOL, like tools/side-preview.html: not in sw.js's PRECACHE and not part
  of the shipped game.
-->
<style>
  html, body { margin: 0; background: #faf1e5; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="1200" height="1200"></canvas>
<script type="module">
import { createRig } from '../src/dog/rig.js';
import { createDogRenderer } from '../src/dog/draw.js';
import BALANCE from '../src/state/balance.js';

const cv = document.getElementById('cv');
const c = cv.getContext('2d');

/**
 * DRAW ONE BREED, front on.
 *
 * `settle` steps the rig on its own before drawing: the springs start at rest
 * values that are not the standing pose, and a dog rendered on frame 0 is a dog
 * mid-flinch. Stepping it silently for a second gives the pose the game shows.
 */
function render(breedId, o = {}) {
  const bg = o.bg === undefined ? '#faf1e5' : o.bg;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cv.width, cv.height);
  if (bg) { c.fillStyle = bg; c.fillRect(0, 0, cv.width, cv.height); }

  const rig = createRig({ breed: breedId, reduced: false });
  const dog = createDogRenderer(rig);
  /* settle the springs into the standing pose */
  const settle = o.settle === undefined ? 90 : o.settle;
  for (let i = 0; i < settle; i++) rig.update(1 / 60);

  /* the game's own units, scaled to fill this canvas: `view.floorY` is where he
     stands, so the transform puts that line near the bottom */
  const V = BALANCE.view;
  const k = (o.scale === undefined ? 2.4 : o.scale);
  c.save();
  /* centre him horizontally and stand him on `groundAt` of the canvas height */
  const groundAt = o.groundAt === undefined ? 0.94 : o.groundAt;
  c.translate(cv.width / 2 - rig.x * k, cv.height * groundAt - rig.floorV * k);
  c.scale(k, k);
  const g = { ctx: c, view: { vs: 1, dpr: 1, offX: 0, offY: 0, cw: cv.width, ch: cv.height,
    bleedX: 0, bleedY: 0, safe: { top: 0, bottom: 0, left: 0, right: 0 } } };
  dog.draw(g, null, o.mood === undefined ? 0.8 : o.mood, null, null);
  c.restore();
  return { breed: rig.breed.id, x: rig.x, floorV: rig.floorV, s: rig.s };
}

window.__portrait = { render, breeds: ['shiba', 'schnoodle', 'cockapoo'] };
window.__portrait.last = render('shiba');
</script>
</body>
</html>
