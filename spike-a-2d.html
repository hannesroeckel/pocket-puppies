<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e3bd8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<title>Style A - Hand-crafted 2D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;width:100%;overflow:hidden;background:#2a1c14;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
  body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #safeprobe{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;
       padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
       padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
  .caption{position:absolute;left:0;right:0;bottom:0;z-index:5;pointer-events:none;text-align:center;
       padding:0 18px calc(13px + env(safe-area-inset-bottom,0px)) 18px;}
  .cap-t{font-size:11px;font-weight:700;letter-spacing:.155em;text-transform:uppercase;color:#fff6e8;
       opacity:.94;text-shadow:0 1px 4px rgba(48,24,12,.65);}
  .cap-h{margin-top:3px;font-size:12.5px;font-weight:500;letter-spacing:.02em;color:#ffe7c4;
       opacity:.72;text-shadow:0 1px 4px rgba(48,24,12,.6);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safeprobe"></div>
<div class="caption">
  <div class="cap-t">Style A &mdash; Hand-crafted 2D</div>
  <div class="cap-h" id="hint">Stroke the puppy</div>
</div>
<script>
(function(){
'use strict';

/* ============================================================
   0. MATH / EASING / NOISE
   ============================================================ */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function smoother(t){ t=clamp(t,0,1); return t*t*t*(t*(t*6-15)+10); }
function easeOut3(t){ return 1-Math.pow(1-t,3); }
function easeIn3(t){ return t*t*t; }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function easeOutBack(t,s){ s=(s===undefined)?1.9:s; var u=t-1; return 1+(s+1)*u*u*u+s*u*u; }
function easeOutElastic(t){ if(t<=0)return 0; if(t>=1)return 1;
  return Math.pow(2,-9*t)*Math.sin((t*10-0.75)*(TAU/3))+1; }
/* hump: 0 -> 1 -> 0 */
function hump(t){ return Math.sin(clamp(t,0,1)*Math.PI); }
/* window that ramps in and out with plateau */
function plateau(t,inT,outT){
  if(t<inT) return smooth(t/inT);
  if(t>1-outT) return smooth((1-t)/outT);
  return 1;
}

var _seed = 20260728;
function rnd(){ _seed = (_seed*1664525 + 1013904223) & 0x7fffffff; return _seed/0x7fffffff; }
function rr(a,b){ return a + rnd()*(b-a); }
function ri(a,b){ return Math.floor(rr(a,b+1)); }
function pick(arr){ return arr[Math.min(arr.length-1, (rnd()*arr.length)|0)]; }

var NT = new Float32Array(512);
for(var _i=0;_i<512;_i++) NT[_i] = rnd()*2-1;
function noise1(x){
  var i = Math.floor(x), f = x-i;
  var a = NT[((i%512)+512)%512], b = NT[(((i+1)%512)+512)%512];
  return lerp(a,b,smooth(f));
}
function fbm(x){ return noise1(x)*0.62 + noise1(x*2.17+13.3)*0.26 + noise1(x*4.61+41.7)*0.12; }

/* ============================================================
   1. SPRING  (semi-implicit, substepped -> stable + snappy)
   ============================================================ */
function Spring(v,k,d){
  this.x=v; this.t=v; this.v=0;
  this.k=(k===undefined)?110:k;
  this.d=(d===undefined)?14:d;
}
Spring.prototype.to=function(t){ this.t=t; return this; };
Spring.prototype.set=function(v){ this.x=v; this.t=v; this.v=0; return this; };
Spring.prototype.kick=function(a){ this.v+=a; return this; };
Spring.prototype.step=function(dt){
  var n = dt>0.009 ? Math.ceil(dt/0.008) : 1;
  if(n>6) n=6;
  var h = dt/n, i, a;
  for(i=0;i<n;i++){
    a = (this.t-this.x)*this.k - this.v*this.d;
    this.v += a*h;
    this.x += this.v*h;
  }
  return this.x;
};

/* critically damped smoothing for slow drifts (cheaper, no overshoot) */
function approach(cur,target,rate,dt){ return cur + (target-cur)*(1-Math.exp(-rate*dt)); }

/* ============================================================
   2. PATH HELPERS  (Catmull-Rom -> bezier, for organic shapes)
   ============================================================ */
function crClosed(c, p, tension){
  var n=p.length, t=(tension===undefined)?1:tension, i;
  if(n<3){ return; }
  c.moveTo(p[0].x,p[0].y);
  for(i=0;i<n;i++){
    var p0=p[(i-1+n)%n], p1=p[i], p2=p[(i+1)%n], p3=p[(i+2)%n];
    c.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6*t, p1.y+(p2.y-p0.y)/6*t,
      p2.x-(p3.x-p1.x)/6*t, p2.y-(p3.y-p1.y)/6*t,
      p2.x, p2.y);
  }
  c.closePath();
}
function crOpen(c, p, tension){
  var n=p.length, t=(tension===undefined)?1:tension, i;
  if(n<2) return;
  c.moveTo(p[0].x,p[0].y);
  for(i=0;i<n-1;i++){
    var p0=p[i>0?i-1:0], p1=p[i], p2=p[i+1], p3=p[i+2<n?i+2:n-1];
    c.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6*t, p1.y+(p2.y-p0.y)/6*t,
      p2.x-(p3.x-p1.x)/6*t, p2.y-(p3.y-p1.y)/6*t,
      p2.x, p2.y);
  }
}
function pt(x,y){ return {x:x,y:y}; }

/* tapered ribbon from a polyline + per-node half-widths */
function ribbon(c, nodes, widths){
  var i, left=[], right=[], n=nodes.length;
  for(i=0;i<n;i++){
    var px = nodes[Math.max(0,i-1)], nx = nodes[Math.min(n-1,i+1)];
    var dx = nx.x-px.x, dy = nx.y-px.y, L = Math.hypot(dx,dy)||1;
    var nxv = -dy/L, nyv = dx/L, w = widths[i];
    left.push(pt(nodes[i].x+nxv*w, nodes[i].y+nyv*w));
    right.push(pt(nodes[i].x-nxv*w, nodes[i].y-nyv*w));
  }
  right.reverse();
  crClosed(c, left.concat(right), 0.85);
}

/* 2-bone IK: returns knee position */
function ik(hx,hy,px,py,l1,l2,sign){
  var dx=px-hx, dy=py-hy, d=Math.hypot(dx,dy);
  var lo=Math.abs(l1-l2)+0.02, hi=l1+l2-0.02;
  d = clamp(d, lo, hi);
  var cosA = clamp((l1*l1 + d*d - l2*l2)/(2*l1*d), -1, 1);
  var a = Math.acos(cosA);
  var base = Math.atan2(dy,dx) + a*sign;
  return pt(hx+Math.cos(base)*l1, hy+Math.sin(base)*l1);
}

/* ============================================================
   3. PALETTE
   ============================================================ */
var C = {
  coat:'#e9954f', coatHi:'#f8bf82', coatMid:'#dd8443', coatSh:'#c56d38', coatDeep:'#a2542b',
  cream:'#fdf4e2', creamMid:'#f6e5c8', creamSh:'#e7cfa8',
  line:'#7c4a2f', line2:'#8f5b3a',
  nose:'#413028', eye:'#33241d', eyeHi:'#fffaf0',
  inner:'#e69f95', tongue:'#f08e97', tongueSh:'#d9707d', mouth:'#5a3130',
  heart:'#f2687e', heart2:'#ffa4b3',
  wallA:'#f9e9cd', wallB:'#f1d6ad', wallC:'#e2bb8c',
  floorA:'#d59a62', floorB:'#bd7f4d', floorLine:'#a86a3e',
  base:'#f6e6ca', baseSh:'#d9b989',
  rug1:'#cf6e58', rug2:'#f3e0c2', rug3:'#bd5b4a', rug4:'#8fa89c',
  teal:'#87a89c', tealD:'#6c8b80', tealL:'#a9c4b8',
  glass1:'#cfe4e6', glass2:'#eef4ea',
  frame:'#fdf6e6', frameSh:'#dcc4a0',
  shadow:'rgba(104,58,32,0.30)'
};

/* ============================================================
   4. VIEW / CANVAS
   ============================================================ */
var VW=390, VH=844, FLOOR=545;
var cv = document.getElementById('c');
var ctx = cv.getContext('2d', {alpha:false});
var dpr=1, cssW=390, cssH=844, VS=1, offX=0, offY=0, bleedX=0, bleedY=0;
var roomCv=null, ovCv=null, grainPat=null;
var safeT=0, safeB=0, safeL=0, safeR=0;

function readSafe(){
  var p=document.getElementById('safeprobe');
  var s=getComputedStyle(p);
  safeT=parseFloat(s.paddingTop)||0;
  safeB=parseFloat(s.paddingBottom)||0;
  safeL=parseFloat(s.paddingLeft)||0;
  safeR=parseFloat(s.paddingRight)||0;
}
function applyView(c,scale){
  var s=(scale===undefined)?dpr:scale;
  c.setTransform(s*VS,0,0,s*VS, s*offX, s*offY);
}
function resize(){
  cssW = Math.max(1, window.innerWidth);
  cssH = Math.max(1, window.innerHeight);
  dpr  = clamp(window.devicePixelRatio||1, 1, 2.25);
  cv.width  = Math.round(cssW*dpr);
  cv.height = Math.round(cssH*dpr);
  cv.style.width = cssW+'px';
  cv.style.height = cssH+'px';
  VS = Math.min(cssW/VW, cssH/VH);
  offX = (cssW - VW*VS)/2;
  offY = (cssH - VH*VS)/2;
  bleedX = offX/VS + 3;
  bleedY = offY/VS + 3;
  readSafe();
  buildRoom();
  buildOverlay();
}

function makeOff(w,h){
  var o=document.createElement('canvas'); o.width=w; o.height=h; return o;
}

/* ============================================================
   5. ROOM  (baked once per resize)
   ============================================================ */
function buildGrain(){
  var S=140, g=makeOff(S,S), gc=g.getContext('2d');
  var img=gc.createImageData(S,S), d=img.data, i, v;
  for(i=0;i<S*S;i++){
    v = rnd();
    var warm = v>0.5;
    d[i*4+0] = warm?255:120;
    d[i*4+1] = warm?238:72;
    d[i*4+2] = warm?205:44;
    d[i*4+3] = Math.floor(Math.pow(rnd(),1.7)*38);
  }
  gc.putImageData(img,0,0);
  return g;
}

function roundRect(c,x,y,w,h,r){
  var rr2=Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr2,y);
  c.lineTo(x+w-rr2,y); c.quadraticCurveTo(x+w,y,x+w,y+rr2);
  c.lineTo(x+w,y+h-rr2); c.quadraticCurveTo(x+w,y+h,x+w-rr2,y+h);
  c.lineTo(x+rr2,y+h); c.quadraticCurveTo(x,y+h,x,y+h-rr2);
  c.lineTo(x,y+rr2); c.quadraticCurveTo(x,y,x+rr2,y);
  c.closePath();
}
function ell(c,x,y,rx,ry,rot){
  c.beginPath(); c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);
}

/* window geometry (shared with light shaft + POIs) */
var WIN = {x:210, y:104, w:146, h:214, r:14};

function drawWindow(c){
  var x=WIN.x, y=WIN.y, w=WIN.w, h=WIN.h;
  /* outer warm bloom on the wall */
  var bl=c.createRadialGradient(x+w/2, y+h*0.55, 20, x+w/2, y+h*0.55, w*1.5);
  bl.addColorStop(0,'rgba(255,240,199,0.55)');
  bl.addColorStop(0.45,'rgba(255,236,190,0.20)');
  bl.addColorStop(1,'rgba(255,236,190,0)');
  c.fillStyle=bl;
  c.fillRect(x-w, y-h*0.35, w*3, h*2.1);

  /* frame */
  c.fillStyle=C.frameSh;
  roundRect(c, x-11, y-11, w+22, h+22, WIN.r+7); c.fill();
  c.fillStyle=C.frame;
  roundRect(c, x-9, y-13, w+18, h+22, WIN.r+6); c.fill();

  /* glass */
  c.save();
  roundRect(c, x, y, w, h, WIN.r); c.clip();
  var sky=c.createLinearGradient(0,y,0,y+h);
  sky.addColorStop(0,'#bcdbe4');
  sky.addColorStop(0.42,'#d9ebe6');
  sky.addColorStop(0.72,'#f0f0dc');
  sky.addColorStop(1,'#f8ecc8');
  c.fillStyle=sky; c.fillRect(x,y,w,h);

  /* soft clouds */
  c.fillStyle='rgba(255,255,255,0.72)';
  ell(c, x+42, y+44, 30, 13); c.fill();
  ell(c, x+66, y+37, 22, 11); c.fill();
  ell(c, x+104, y+58, 24, 10); c.fill();
  c.fillStyle='rgba(255,255,255,0.42)';
  ell(c, x+30, y+80, 34, 10); c.fill();

  /* distant hills */
  c.fillStyle='#b9cdb4';
  c.beginPath(); c.moveTo(x-4, y+h*0.70);
  c.quadraticCurveTo(x+w*0.24, y+h*0.55, x+w*0.52, y+h*0.70);
  c.quadraticCurveTo(x+w*0.78, y+h*0.84, x+w+4, y+h*0.66);
  c.lineTo(x+w+4, y+h+4); c.lineTo(x-4, y+h+4); c.closePath(); c.fill();
  c.fillStyle='#a4bda1';
  c.beginPath(); c.moveTo(x-4, y+h*0.82);
  c.quadraticCurveTo(x+w*0.38, y+h*0.70, x+w+4, y+h*0.86);
  c.lineTo(x+w+4, y+h+4); c.lineTo(x-4, y+h+4); c.closePath(); c.fill();

  /* tree branch silhouette entering top-left */
  c.strokeStyle='rgba(108,124,96,0.85)'; c.lineWidth=3.4; c.lineCap='round';
  c.beginPath(); c.moveTo(x-2, y+16); c.quadraticCurveTo(x+30, y+26, x+52, y+14); c.stroke();
  c.lineWidth=2.2;
  c.beginPath(); c.moveTo(x+22, y+22); c.quadraticCurveTo(x+30, y+40, x+44, y+46); c.stroke();
  var lv=[[x+8,y+22,7,4,-0.4],[x+24,y+16,8,4.4,0.25],[x+38,y+13,7,4,-0.2],[x+50,y+16,6,3.4,0.5],
          [x+30,y+33,6,3.6,0.8],[x+42,y+45,7,4,0.35],[x+16,y+28,6,3.4,0.9]];
  c.fillStyle='#8fa886';
  for(var li=0;li<lv.length;li++){ ell(c, lv[li][0],lv[li][1],lv[li][2],lv[li][3],lv[li][4]); c.fill(); }

  /* glass sheen */
  var sh=c.createLinearGradient(x, y, x+w*0.8, y+h);
  sh.addColorStop(0,'rgba(255,255,255,0.34)');
  sh.addColorStop(0.4,'rgba(255,255,255,0.05)');
  sh.addColorStop(1,'rgba(255,255,255,0.16)');
  c.fillStyle=sh; c.fillRect(x,y,w,h);
  c.restore();

  /* muntins */
  c.strokeStyle=C.frame; c.lineWidth=9;
  c.beginPath(); c.moveTo(x+w/2, y-2); c.lineTo(x+w/2, y+h+2); c.stroke();
  c.beginPath(); c.moveTo(x-2, y+h*0.46); c.lineTo(x+w+2, y+h*0.46); c.stroke();
  c.strokeStyle='rgba(220,196,160,0.55)'; c.lineWidth=1.4;
  c.beginPath(); c.moveTo(x+w/2+4.5, y-2); c.lineTo(x+w/2+4.5, y+h+2); c.stroke();
  c.beginPath(); c.moveTo(x-2, y+h*0.46+4.5); c.lineTo(x+w+2, y+h*0.46+4.5); c.stroke();

  /* frame inner outline */
  c.strokeStyle='rgba(150,110,74,0.35)'; c.lineWidth=2;
  roundRect(c, x, y, w, h, WIN.r); c.stroke();

  /* sill */
  c.fillStyle=C.frame;
  roundRect(c, x-19, y+h+9, w+38, 13, 5); c.fill();
  c.fillStyle=C.frameSh;
  roundRect(c, x-19, y+h+19, w+38, 5, 2.5); c.fill();

  /* little plant on the sill */
  c.fillStyle='#c98a63';
  roundRect(c, x+w-46, y+h-16, 26, 25, 4); c.fill();
  c.fillStyle='#b8794f';
  roundRect(c, x+w-49, y+h-19, 32, 8, 3); c.fill();
  c.strokeStyle='#7f9a76'; c.lineWidth=2.4; c.lineCap='round';
  for(var pi=0;pi<5;pi++){
    var a=-1.9 + pi*0.42;
    c.beginPath(); c.moveTo(x+w-33, y+h-16);
    c.quadraticCurveTo(x+w-33+Math.cos(a)*12, y+h-16+Math.sin(a)*16,
                       x+w-33+Math.cos(a)*20, y+h-16+Math.sin(a)*24-6);
    c.stroke();
  }
  c.fillStyle='#93ad86';
  for(var pj=0;pj<5;pj++){
    var a2=-1.9 + pj*0.42;
    ell(c, x+w-33+Math.cos(a2)*21, y+h-16+Math.sin(a2)*25-7, 5.5, 3.4, a2+0.4); c.fill();
  }
}

function drawShelf(c){
  var sx=30, sy=250, sw=112;
  /* framed picture */
  c.fillStyle='rgba(120,74,44,0.14)';
  roundRect(c, sx+16, sy-96, 74, 84, 4); c.fill();
  c.fillStyle='#c98f5f';
  roundRect(c, sx+12, sy-100, 74, 84, 4); c.fill();
  c.fillStyle='#fdf4e2';
  roundRect(c, sx+18, sy-94, 62, 72, 2); c.fill();
  /* tiny dog portrait */
  c.fillStyle='#e9c9a2';
  roundRect(c, sx+22, sy-90, 54, 64, 2); c.fill();
  c.fillStyle='#c98a52';
  ell(c, sx+49, sy-42, 17, 13); c.fill();
  ell(c, sx+49, sy-58, 13, 12); c.fill();
  c.beginPath(); c.moveTo(sx+39,sy-66); c.lineTo(sx+35,sy-78); c.lineTo(sx+45,sy-71); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(sx+59,sy-66); c.lineTo(sx+63,sy-78); c.lineTo(sx+53,sy-71); c.closePath(); c.fill();
  c.fillStyle='#fdf4e2'; ell(c, sx+49, sy-52, 6, 5); c.fill();
  c.fillStyle='#4a352a';
  ell(c, sx+44, sy-60, 1.7, 2.1); c.fill();
  ell(c, sx+54, sy-60, 1.7, 2.1); c.fill();
  ell(c, sx+49, sy-54, 2.2, 1.7); c.fill();

  /* shelf plank */
  c.fillStyle='rgba(120,74,44,0.16)';
  roundRect(c, sx-2, sy+8, sw+4, 7, 3); c.fill();
  c.fillStyle='#d19a68';
  roundRect(c, sx-4, sy, sw+8, 9, 3); c.fill();
  c.fillStyle='#e0ac7c';
  roundRect(c, sx-4, sy, sw+8, 4, 2); c.fill();

  /* books */
  c.fillStyle=C.tealD; roundRect(c, sx+4, sy-26, 9, 26, 1.6); c.fill();
  c.fillStyle='#cf6e58'; roundRect(c, sx+14, sy-31, 8, 31, 1.6); c.fill();
  c.fillStyle='#e0b06a'; roundRect(c, sx+23, sy-22, 10, 22, 1.6); c.fill();
  c.fillStyle='rgba(255,255,255,0.30)';
  roundRect(c, sx+5.5, sy-22, 6, 2.2, 1); c.fill();
  roundRect(c, sx+15.5, sy-26, 5, 2.2, 1); c.fill();

  /* trailing plant */
  c.fillStyle='#c98a63'; roundRect(c, sx+84, sy-20, 22, 20, 4); c.fill();
  c.fillStyle='#b8794f'; roundRect(c, sx+81, sy-23, 28, 7, 3); c.fill();
  c.strokeStyle='#84a179'; c.lineWidth=2; c.lineCap='round';
  var vines=[[0,26,10],[6,40,-8],[-6,32,16]];
  for(var vi=0;vi<vines.length;vi++){
    var v=vines[vi];
    c.beginPath(); c.moveTo(sx+95+v[0], sy-18);
    c.bezierCurveTo(sx+95+v[0]+v[2], sy-18+v[1]*0.4, sx+95+v[0]-v[2], sy-18+v[1]*0.7, sx+95+v[0]+v[2]*0.5, sy-18+v[1]);
    c.stroke();
    c.fillStyle='#93ad86';
    for(var lf=1;lf<=3;lf++){
      var tt=lf/3.4;
      var lx=sx+95+v[0]+v[2]*tt*1.1, ly=sy-18+v[1]*tt;
      ell(c, lx, ly, 4.6, 3, tt*2); c.fill();
    }
  }
}

function drawBowl(c, bx, by, s, teal){
  c.save(); c.translate(bx,by); c.scale(s,s);
  /* shadow */
  c.fillStyle='rgba(104,58,32,0.20)';
  ell(c, 2, 6, 34, 10); c.fill();
  /* bowl body */
  var g=c.createLinearGradient(-30,-14,30,14);

function drawRug(c){
  var cx=192, cy=698, rx=196, ry=84;
  c.save();
  /* soft drop */
  c.fillStyle='rgba(104,58,32,0.13)';
  ell(c, cx+3, cy+7, rx*1.01, ry*1.02); c.fill();
  /* fringe */
  c.strokeStyle='#e9d3ac'; c.lineWidth=3; c.lineCap='round';
  for(var f=0;f<30;f++){
    var a=(f/30)*TAU;
    var ex=cx+Math.cos(a)*rx, ey=cy+Math.sin(a)*ry;
    var ox=Math.cos(a)*11, oy=Math.sin(a)*7;
    c.beginPath(); c.moveTo(ex,ey); c.lineTo(ex+ox, ey+oy); c.stroke();
  }
  /* layers */
  var g=c.createLinearGradient(cx-rx, cy-ry, cx+rx, cy+ry);
  g.addColorStop(0,'#d97a62'); g.addColorStop(0.5,C.rug1); g.addColorStop(1,'#b85a48');
  c.fillStyle=g; ell(c,cx,cy,rx,ry); c.fill();
  c.fillStyle=C.rug2; ell(c,cx,cy,rx*0.88,ry*0.85); c.fill();
  c.fillStyle=C.rug4; ell(c,cx,cy,rx*0.80,ry*0.76); c.fill();
  c.fillStyle=C.rug2; ell(c,cx,cy,rx*0.74,ry*0.70); c.fill();
  var g2=c.createLinearGradient(cx-rx, cy-ry, cx+rx, cy+ry);
  g2.addColorStop(0,'#cf7460'); g2.addColorStop(1,C.rug3);
  c.fillStyle=g2; ell(c,cx,cy,rx*0.64,ry*0.60); c.fill();
  c.fillStyle='#e2937c'; ell(c,cx,cy,rx*0.30,ry*0.30); c.fill();
  c.fillStyle=C.rug2; ell(c,cx,cy,rx*0.22,ry*0.22); c.fill();
  c.fillStyle=C.rug4; ell(c,cx,cy,rx*0.11,ry*0.11); c.fill();
  /* stitch dashes */
  c.setLineDash([7,9]); c.lineWidth=2.2;
  c.strokeStyle='rgba(253,244,226,0.55)';
  c.beginPath(); c.ellipse(cx,cy,rx*0.955,ry*0.94,0,0,TAU); c.stroke();
  c.strokeStyle='rgba(120,66,42,0.22)';
  c.beginPath(); c.ellipse(cx,cy,rx*0.70,ry*0.655,0,0,TAU); c.stroke();
  c.setLineDash([]);
  /* radial spokes */
  c.strokeStyle='rgba(120,66,42,0.10)'; c.lineWidth=2;
  for(var s2=0;s2<16;s2++){
    var aa=(s2/16)*TAU;
    c.beginPath();
    c.moveTo(cx+Math.cos(aa)*rx*0.24, cy+Math.sin(aa)*ry*0.24);
    c.lineTo(cx+Math.cos(aa)*rx*0.62, cy+Math.sin(aa)*ry*0.58);
    c.stroke();
  }
  /* weave texture */
  c.globalAlpha=0.07; c.strokeStyle='#6b3a24'; c.lineWidth=1;
  for(var w2=-rx;w2<rx;w2+=6){
    c.beginPath(); c.moveTo(cx+w2, cy-ry); c.lineTo(cx+w2, cy+ry); c.stroke();
  }
  c.globalAlpha=1;
  c.restore();
}

function buildRoom(){
  var W=cv.width, H=cv.height;
  roomCv = makeOff(W,H);

  var BX=bleedX+8, x0=-BX, x1=VW+BX, w=x1-x0;
  var BY=bleedY+8;

  /* ---- wall ---- */
  var g=c.createLinearGradient(0,-BY,0,FLOOR+10);
  g.addColorStop(0,C.wallA); g.addColorStop(0.5,C.wallB); g.addColorStop(1,C.wallC);
  c.fillStyle=g; c.fillRect(x0,-BY,w,FLOOR+BY+2);

  /* wall stripes */
  c.save(); c.globalAlpha=0.05; c.fillStyle='#b0774a';
  for(var sx=x0;sx<x1;sx+=28) c.fillRect(sx,-BY,11,FLOOR+BY);
  c.restore();
  /* wall vertical falloff near floor */
  var wf=c.createLinearGradient(0,FLOOR-120,0,FLOOR);
  wf.addColorStop(0,'rgba(150,96,58,0)'); wf.addColorStop(1,'rgba(150,96,58,0.16)');
  c.fillStyle=wf; c.fillRect(x0,FLOOR-120,w,120);

  drawWindow(c);
  drawShelf(c);

  /* ---- light shaft ---- */
  c.save();
  c.beginPath();
  c.moveTo(WIN.x-6, WIN.y+6);
  c.lineTo(WIN.x+WIN.w+6, WIN.y+6);
  c.lineTo(WIN.x+WIN.w-104, VH+40);
  c.lineTo(WIN.x-262, VH+40);
  c.closePath();
  var lg=c.createLinearGradient(WIN.x+WIN.w, WIN.y, WIN.x-170, VH-40);
  lg.addColorStop(0,'rgba(255,241,197,0.40)');
  lg.addColorStop(0.35,'rgba(255,235,183,0.20)');
  lg.addColorStop(0.75,'rgba(255,230,178,0.07)');
  lg.addColorStop(1,'rgba(255,230,178,0)');
  c.fillStyle=lg; c.fill();
  c.restore();

  /* ---- baseboard ---- */
  c.fillStyle=C.base; c.fillRect(x0, FLOOR-27, w, 27);
  c.fillStyle='rgba(255,255,255,0.42)'; c.fillRect(x0, FLOOR-27, w, 4);
  c.fillStyle=C.baseSh; c.fillRect(x0, FLOOR-7, w, 7);
  c.fillStyle='rgba(110,64,38,0.30)'; c.fillRect(x0, FLOOR-1.6, w, 2.6);

  /* ---- floor ---- */
  var fg=c.createLinearGradient(0,FLOOR,0,VH+BY);
  fg.addColorStop(0,'#dda469'); fg.addColorStop(0.34,C.floorA);
  fg.addColorStop(0.75,C.floorB); fg.addColorStop(1,'#a86f42');
  c.fillStyle=fg; c.fillRect(x0,FLOOR,w,VH+BY-FLOOR);

  /* plank seams (perspective spacing) */
  c.save();
  c.strokeStyle='rgba(150,92,52,0.34)'; c.lineWidth=1.4;
  var rows=[], yy=FLOOR, k=0;
  while(yy < VH+BY){
    rows.push(yy);
    yy += 7 + Math.pow(k,1.55)*2.6;
    k++;
  }
  for(var r=1;r<rows.length;r++){
    c.beginPath(); c.moveTo(x0,rows[r]); c.lineTo(x1,rows[r]); c.stroke();
    c.strokeStyle='rgba(255,226,182,0.22)';
    c.beginPath(); c.moveTo(x0,rows[r]+1.6); c.lineTo(x1,rows[r]+1.6); c.stroke();
    c.strokeStyle='rgba(150,92,52,0.34)';
  }
  /* short vertical joints */
  c.strokeStyle='rgba(150,92,52,0.26)'; c.lineWidth=1.2;
  for(var r2=1;r2<rows.length;r2++){
    var span = rows[r2] - rows[r2-1];
    var step = 60 + span*3.2;
    var jitter = ((r2*37)%53)/53*step;
    for(var jx=x0+jitter; jx<x1; jx+=step){
      c.beginPath(); c.moveTo(jx, rows[r2-1]); c.lineTo(jx, rows[r2]); c.stroke();
    }
  }
  /* grain streaks */
  c.globalAlpha=0.10; c.strokeStyle='#8d5730'; c.lineWidth=1;
  for(var gi=0;gi<70;gi++){
    var gy = FLOOR + Math.pow(rnd(),0.7)*(VH+BY-FLOOR);
    var gx = x0 + rnd()*w, gl = 20+rnd()*90;
    c.beginPath(); c.moveTo(gx,gy); c.quadraticCurveTo(gx+gl*0.5, gy+rr(-1.4,1.4), gx+gl, gy); c.stroke();
  }
  c.globalAlpha=1;
  c.restore();

  /* floor light pool where the beam lands */
  c.save();
  c.beginPath(); c.rect(x0,FLOOR,w,VH+BY-FLOOR); c.clip();
  var pg=c.createRadialGradient(150, 700, 20, 150, 700, 300);
  pg.addColorStop(0,'rgba(255,240,196,0.34)');
  pg.addColorStop(0.5,'rgba(255,236,188,0.13)');
  pg.addColorStop(1,'rgba(255,236,188,0)');
  c.fillStyle=pg;
  c.save(); c.translate(150,700); c.scale(1,0.5); c.translate(-150,-700);
  c.fillRect(-200,400,900,600);
  c.restore();
  c.restore();

  drawRug(c);
  drawBowl(c, 66, 626, 0.86, false);
  drawBowl(c, 128, 604, 0.62, true);
  drawBall(c, 330, 736, 1.0);
  drawBone(c, 96, 792, -0.22);
  drawPouf(c);

  /* ambient occlusion where wall meets floor, corners */
  var ao=c.createLinearGradient(0,FLOOR,0,FLOOR+70);
  ao.addColorStop(0,'rgba(110,60,32,0.26)'); ao.addColorStop(1,'rgba(110,60,32,0)');
  c.fillStyle=ao; c.fillRect(x0,FLOOR,w,70);
}

/* ---- press / stroke deformation field ---- */
var presses=[];
function addPress(lx,ly,dx,dy,str,r){
  if(presses.length>5) presses.shift();
  presses.push({lx:lx,ly:ly,dx:dx,dy:dy,str:str,r:r});
}
function stepPresses(dt){
  var i, k=Math.exp(-dt*5.2);
  for(i=presses.length-1;i>=0;i--){
    presses[i].str *= k;
    if(presses[i].str<0.015) presses.splice(i,1);
  }
}
/* deform a point given in shape-local coords, with shape origin at (ox,oy) in puppy space */
var _dfx=0,_dfy=0;
function deform(x,y,ox,oy,gain){
  var wx=x+ox, wy=y+oy, dx=0, dy=0, i, p, ddx, ddy, f;
  for(i=0;i<presses.length;i++){
    p=presses[i];
    ddx=wx-p.lx; ddy=wy-p.ly;
    f = Math.exp(-(ddx*ddx+ddy*ddy)/(p.r*p.r));
    dx += (p.dx*0.85 - ddx*0.20) * p.str * f;
    dy += (p.dy*0.85 - ddy*0.20) * p.str * f;
  }
  _dfx = x + dx*gain; _dfy = y + dy*gain;
}
function defPath(c, pts, ox, oy, sx, sy, gain){
  var out=[], i;
  for(i=0;i<pts.length;i++){
    deform(pts[i].x*sx, pts[i].y*sy, ox, oy, gain);
    out.push(pt(_dfx,_dfy));
  }
  crClosed(c,out,1);
  return out;
}

/* ---- cached gradients (local space, valid across frames) ---- */

/* ---- pose cache (filled each frame) ---- */
var PO = {
  bodyX:0, bodyY:-86, bodyHW:52, bodyHH:43, bodyRot:0,
  headX:0, headY:-158, headRot:0, yaw:0, pitch:0,
  muzX:0, muzY:0, tailNodes:[], tailW:[],
  eyeOpenEff:1, sit:0
};

/* ============================================================
   7. PUPPY UPDATE
   ============================================================ */
function updateRig(dt){
  var i;
  P.t += dt;

  /* --- breathing: asymmetric (quick in, slow out) --- */
  P.breathSpd = lerp(0.85, 1.75, clamp(pet.x*0.6 + affection*0.35, 0, 1));
  P.breath += dt * P.breathSpd;
  var bp = (P.breath % 1);
  var breathe = bp<0.38 ? smoother(bp/0.38) : 1-smoother((bp-0.38)/0.62);

  /* --- blink lane --- */
  if(P.blinkT>0){
    P.blinkT -= dt;
    var u = 1 - clamp(P.blinkT/P.blinkDur,0,1);
    P.blink = hump(u);
    if(P.blinkT<=0 && P.blinkQ>0){ P.blinkQ--; P.blinkT=P.blinkDur; }
  } else P.blink = 0;

  /* --- springs --- */
  P.sit.step(dt); P.lift.step(dt); P.sway.step(dt); P.roll.step(dt);
  P.squash.step(dt); P.melt.step(dt); P.perk.step(dt);
  P.yaw.step(dt); P.pitch.step(dt); P.tilt.step(dt);
  P.headLift.step(dt); P.headPush.step(dt);
  P.earL.step(dt); P.earR.step(dt); P.earBack.step(dt);
  P.eyeOpen.step(dt); P.eyeSmile.step(dt); P.brow.step(dt);
  P.mouth.step(dt); P.smile.step(dt); P.tongue.step(dt); P.noseTw.step(dt);
  P.wagAmp.step(dt); P.wagSpd.step(dt); P.tailUp.step(dt);
  P.pawLift[0].step(dt); P.pawLift[1].step(dt); P.hindKick.step(dt);
  for(i=0;i<TUFTS.length;i++) TUFTS[i].sp.step(dt);

  /* --- slow idle weight shift (organic noise, not a loop) --- */
  var wob = fbm(P.t*0.24)*1.0;
  var wob2 = fbm(P.t*0.17+40)*1.0;

  /* --- resolve body pose --- */
  var sit=P.sit.x, melt=P.melt.x;
  var sq = P.squash.x + melt*0.16 + breathe*0.020;
  PO.sit = sit;
  PO.bodyHH = D.bodyHH * (1 - sq*0.55) * (1 + sit*0.03);
  PO.bodyHW = D.bodyHW * (1 + sq*0.34) * (1 + sit*0.06);
  PO.bodyY  = D.bodyY + sit*17 + melt*7 - P.lift.x - P.perk.x*3
              + (D.bodyHH-PO.bodyHH)*1.0 + wob*0.8;
  PO.bodyX  = P.sway.x + wob2*1.4;
  PO.bodyRot = P.roll.x + wob*0.008;

  /* wiggle when the rump is being fussed */
  P.wigglePhase += dt * lerp(3.0, 12.0, zTail.x);
  if(zTail.x>0.02) PO.bodyX += Math.sin(P.wigglePhase)*zTail.x*5.5;

  /* happy shiver */
  if(P.shiverT>0){
    P.shiverT -= dt;
    var sv = clamp(P.shiverT/0.55,0,1);
    PO.bodyX += Math.sin(P.t*54)*3.2*sv;
    PO.bodyRot += Math.sin(P.t*47)*0.030*sv;
  }

  /* --- head placement (follows the body, with lag) --- */
  PO.yaw = clamp(P.yaw.x,-1.35,1.35);
  PO.pitch = clamp(P.pitch.x,-1.1,1.1);
  var neckX = PO.bodyX + Math.sin(PO.bodyRot)*(-D.neckDY);
  var neckY = PO.bodyY + D.neckDY*Math.cos(PO.bodyRot) - (D.bodyHH-PO.bodyHH)*0.55;
  PO.headX = neckX + PO.yaw*7 + P.headPush.x*6;
  PO.headY = neckY - 26 - P.headLift.x + sit*2 + melt*5
             - PO.pitch*3 + breathe*0.8 - P.perk.x*4;
  PO.headRot = P.tilt.x + PO.bodyRot*0.55 + PO.yaw*0.05;

  /* ear secondary motion: react to head angular + lateral velocity */
  var hvx = (PO.headX - (PO.lastHX===undefined?PO.headX:PO.lastHX));
  var hvy = (PO.headY - (PO.lastHY===undefined?PO.headY:PO.lastHY));
  var hvr = (PO.headRot - (PO.lastHR===undefined?PO.headRot:PO.lastHR));
  PO.lastHX=PO.headX; PO.lastHY=PO.headY; PO.lastHR=PO.headRot;
  var inv = dt>0.0001 ? 1/dt : 0;
  var swingL = clamp((-hvx*inv*0.0022 - hvr*inv*0.06 + hvy*inv*0.0011), -0.5, 0.5);
  var swingR = clamp(( hvx*inv*0.0022 + hvr*inv*0.06 + hvy*inv*0.0011), -0.5, 0.5);
  P.earL.kick(swingL*dt*46);
  P.earR.kick(swingR*dt*46);

  /* --- tail: springy chain with travelling wave + whip lag --- */
  P.wagPhase += dt * P.wagSpd.x * TAU * 0.5;
  var amp = P.wagAmp.x;
  for(i=0;i<TL.n;i++){
    var wave = Math.sin(P.wagPhase - i*0.55) * amp * (i===0?1.0:0.42);
    var tgt = (i===0 ? TL.base - P.tailUp.x*0.45 : TL.curl) + wave;
    if(i>0) tgt += TL.dev[i-1]*0.32;
    var k = i===0?150:190, d=i===0?13:12.5;
    var a = (tgt-TL.rel[i])*k - TL.vel[i]*d;
    TL.vel[i] += a*Math.min(dt,0.02);
    if(dt>0.02){ var a2=(tgt-TL.rel[i]-TL.vel[i]*(dt-0.02))*k - TL.vel[i]*d; TL.vel[i]+=a2*(dt-0.02); }
    TL.rel[i] += TL.vel[i]*dt;
    TL.dev[i] = TL.rel[i] - (i===0?TL.base:TL.curl);
  }
  /* build node positions - base sits on the HIP so the curl reads as attached */
  var tx = PO.bodyX + PO.bodyHW*0.84, ty = PO.bodyY + PO.bodyHH*0.10;
  var ang=0;
  PO.tailNodes.length=0;
  PO.tailNodes.push(pt(tx,ty));
  for(i=0;i<TL.n;i++){
    ang += TL.rel[i];
    tx += Math.cos(ang)*TL.len[i];
    ty += Math.sin(ang)*TL.len[i];
    PO.tailNodes.push(pt(tx,ty));
  }

  /* --- eyes --- */
  var openBase = clamp(P.eyeOpen.x, 0, 1.25);
  PO.eyeOpenEff = clamp(openBase * (1 - P.blink), 0, 1.25);

  /* --- muzzle world position (for zone tests) --- */
  var mYaw = PO.yaw;
  PO.muzX = PO.headX + Math.cos(PO.headRot)*(mYaw*20) - Math.sin(PO.headRot)*(D.muzY - PO.pitch*10);
  PO.muzY = PO.headY + Math.sin(PO.headRot)*(mYaw*20) + Math.cos(PO.headRot)*(D.muzY - PO.pitch*10);

  /* --- final drawn origin --- */
  P.px = P.x;
  P.py = P.y;

  /* kick phase for the belly-rub hind-leg twitch */
  P.kickPhase += dt * 9.5;
  stepPresses(dt);
}

/* ============================================================
   8. PUPPY DRAW
   ============================================================ */
/* a soft rounded fur clump (deliberately NOT a sharp spike) */
function drawTuft(c, bx,by,a,len,w,curl){
  var ca=Math.cos(a), sa=Math.sin(a);
  var nx=-sa, ny=ca;
  var mx=bx+ca*len*0.50 + nx*curl,     my=by+sa*len*0.50 + ny*curl;
  var tx=bx+ca*len      + nx*curl*1.35, ty=by+sa*len      + ny*curl*1.35;
  var tw=w*0.60;
  c.beginPath();
  c.moveTo(bx+nx*w, by+ny*w);
  c.quadraticCurveTo(mx+nx*w*0.92, my+ny*w*0.92, tx+nx*tw, ty+ny*tw);
  c.quadraticCurveTo(tx+ca*tw*1.55, ty+sa*tw*1.55, tx-nx*tw, ty-ny*tw);
  c.quadraticCurveTo(mx-nx*w*0.92, my-ny*w*0.92, bx-nx*w, by-ny*w);
  c.closePath();
}

function drawTail(c){
  var n=PO.tailNodes, i, ws=[];
  var fl = 1 + P.wagAmp.x*0.10;
  for(i=0;i<n.length;i++) ws.push(TL.wid[i]*fl);
  /* soft outline */
  c.beginPath(); ribbon(c, n, ws.map(function(v){return v+2.0;}));
  c.fillStyle=C.line; c.globalAlpha=0.85; c.fill(); c.globalAlpha=1;
  /* body */
  c.beginPath(); ribbon(c, n, ws);
  c.fillStyle=G.tail; c.fill();
  /* cream underside on the inner edge of the curl */
  var inner=[], iw=[];
  for(i=2;i<n.length;i++){
    var px2=n[Math.max(0,i-1)], nx2=n[Math.min(n.length-1,i+1)];
    var dx=nx2.x-px2.x, dy=nx2.y-px2.y, L=Math.hypot(dx,dy)||1;
    inner.push(pt(n[i].x + (dy/L)*ws[i]*0.34, n[i].y - (dx/L)*ws[i]*0.34));
    iw.push(ws[i]*0.42);
  }
  if(inner.length>2){
    c.beginPath(); ribbon(c, inner, iw);
    c.fillStyle=C.creamMid; c.globalAlpha=0.9; c.fill(); c.globalAlpha=1;
  }
  /* soft floof on the last two joints of the tail */
  c.fillStyle=C.coatHi;
  for(i=n.length-2;i<n.length;i++){
    var a=Math.atan2(n[i].y-n[i-1].y, n[i].x-n[i-1].x);
    drawTuft(c, n[i].x, n[i].y, a-1.30, 7, 3.4, 1.2); c.fill();
    drawTuft(c, n[i].x, n[i].y, a+1.30, 6.4, 3.2, -1.1); c.fill();
  }
}

function drawLeg(c, hx,hy, px2,py2, bow, w, dark, pawScale){
  var mx=(hx+px2)/2, my=(hy+py2)/2;
  var dx=px2-hx, dy=py2-hy, L=Math.hypot(dx,dy)||1;
  var nx=-dy/L, ny=dx/L;
  var kx=mx+nx*bow, ky=my+ny*bow;
  var nodes=[pt(hx,hy), pt(kx,ky), pt(lerp(kx,px2,0.55), lerp(ky,py2,0.55)), pt(px2,py2)];
  var ws=[w, w*0.84, w*0.72, w*0.66];
  /* outline */
  c.beginPath(); ribbon(c, nodes, ws.map(function(v){return v+2.0;}));
  c.fillStyle=C.line; c.globalAlpha=dark?0.9:0.85; c.fill(); c.globalAlpha=1;
  c.beginPath(); ribbon(c, nodes, ws);
  c.fillStyle = dark? C.coatSh : C.coat; c.fill();
  if(!dark){
    /* narrow cream stocking down the front of the leg */
    c.beginPath(); ribbon(c, [nodes[1],nodes[2],nodes[3]],
                          [ws[1]*0.26, ws[2]*0.34, ws[3]*0.50]);
    c.fillStyle=C.creamMid; c.globalAlpha=0.55; c.fill(); c.globalAlpha=1;
  }
  /* paw */
  var ps=(pawScale===undefined?1:pawScale);
  var pr=w*1.06*ps;
  c.fillStyle=C.line; ell(c, px2, py2-1.2, pr+1.8, pr*0.80+1.8); c.fill();
  c.fillStyle= dark? C.creamSh : C.cream; ell(c, px2, py2-1.6, pr, pr*0.80); c.fill();
  if(!dark){
    c.strokeStyle='rgba(124,74,47,0.42)'; c.lineWidth=1.3;
    c.beginPath(); c.moveTo(px2-pr*0.34, py2-1.6); c.lineTo(px2-pr*0.34, py2+pr*0.5); c.stroke();
    c.beginPath(); c.moveTo(px2+pr*0.34, py2-1.6); c.lineTo(px2+pr*0.34, py2+pr*0.5); c.stroke();
  }
}

/* Cute lens-shaped eye: two symmetric arcs. As `smi` rises the lower arc
   bows upward and the eye becomes a happy crescent - one shape covers
   wide-open, mid-blink and blissful squint. */
function drawEye(c, ex,ey,w,h,open,smi,tiltA,side){
  var hh   = h*0.5*clamp(open,0.02,1.25);
  var topC = -hh*1.36;
  var botC =  hh*1.36*(1 - smi*1.92);
  c.save();
  c.translate(ex,ey); c.rotate(tiltA*side);
  c.beginPath();
  c.moveTo(-w/2, 0);
  c.quadraticCurveTo( w*0.11*side, topC,  w/2, 0);
  c.quadraticCurveTo(-w*0.11*side, botC, -w/2, 0);
  c.closePath();
  c.restore();
  c.fillStyle=C.eye; c.fill();
  c.strokeStyle=C.eye; c.lineWidth=2.1; c.lineJoin='round'; c.stroke();
  /* catchlights: same screen-side in both eyes (single light source) */
  var hv = clamp((open-0.30)/0.70,0,1)*(1-smi*0.62);
  if(hv>0.02){
    c.save(); c.translate(ex,ey); c.rotate(tiltA*side);
    c.fillStyle=C.eyeHi; c.globalAlpha=0.96*hv;
    ell(c, w*0.19, -hh*0.40, w*0.21, hh*0.29, -0.45); c.fill();
    c.globalAlpha=0.50*hv;
    ell(c, -w*0.20, hh*0.34, w*0.11, hh*0.15, 0.3); c.fill();
    c.globalAlpha=1; c.restore();
  }
}

function drawMouth(c, mx,my, op, smi, tg){
  var cw = 12 + smi*3.2;
  var lipY = my;
  if(op>0.03){
    var oh = op*20;
    /* dark interior */
    c.beginPath();
    c.moveTo(-cw+mx, lipY-1);
    c.quadraticCurveTo(mx, lipY-3.5, cw+mx, lipY-1);
    c.bezierCurveTo(cw*0.95+mx, lipY+oh*0.72, cw*0.45+mx, lipY+oh, mx, lipY+oh);
    c.bezierCurveTo(-cw*0.45+mx, lipY+oh, -cw*0.95+mx, lipY+oh*0.72, -cw+mx, lipY-1);
    c.closePath();
    c.fillStyle=C.mouth; c.fill();
    /* tongue */
    var tl = oh*(0.42+tg*0.5);
    c.save();
    c.beginPath();
    c.moveTo(-cw+mx, lipY-1);
    c.quadraticCurveTo(mx, lipY-3.5, cw+mx, lipY-1);
    c.bezierCurveTo(cw*0.95+mx, lipY+oh*0.72, cw*0.45+mx, lipY+oh, mx, lipY+oh);
    c.bezierCurveTo(-cw*0.45+mx, lipY+oh, -cw*0.95+mx, lipY+oh*0.72, -cw+mx, lipY-1);
    c.closePath(); c.clip();
    c.fillStyle=C.tongue;
    ell(c, mx, lipY+oh-tl*0.30, cw*0.78, tl*0.92); c.fill();
    c.fillStyle=C.tongueSh;
    c.beginPath(); c.moveTo(mx, lipY+oh-tl*1.1); c.lineTo(mx, lipY+oh); c.lineWidth=1.6;
    c.strokeStyle=C.tongueSh; c.stroke();
    c.restore();
    /* little teeth */
    c.fillStyle='#fffaf0';
    c.beginPath(); c.moveTo(mx-cw*0.55, lipY-0.5); c.lineTo(mx-cw*0.34, lipY-0.5);
    c.lineTo(mx-cw*0.45, lipY+4.0); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(mx+cw*0.34, lipY-0.5); c.lineTo(mx+cw*0.55, lipY-0.5);
    c.lineTo(mx+cw*0.45, lipY+4.0); c.closePath(); c.fill();
    /* lip line */
    c.strokeStyle=C.line; c.lineWidth=2.0;
    c.beginPath(); c.moveTo(-cw+mx, lipY-1);
    c.quadraticCurveTo(mx, lipY-3.5, cw+mx, lipY-1); c.stroke();
  }
  /* the classic shiba "w" - always drawn, becomes the outer lip when open.
     corners RISE with smile so the neutral face never reads as a frown */
  var dip    = 2.6 - smi*1.1;                       /* how far the curve dips */
  var corner = -2.2 - smi*5.6 + (op>0.03? 1.4:0);   /* corner height vs centre */
  c.strokeStyle=C.line; c.lineWidth=2.2; c.lineCap='round';
  c.beginPath();
  c.moveTo(mx, lipY-5.0);
  c.quadraticCurveTo(mx-cw*0.52, lipY+dip, mx-cw, lipY+corner);
  c.stroke();
  c.beginPath();
  c.moveTo(mx, lipY-5.0);
  c.quadraticCurveTo(mx+cw*0.52, lipY+dip, mx+cw, lipY+corner);
  c.stroke();
  /* philtrum */
  c.lineWidth=1.8;
  c.beginPath(); c.moveTo(mx, lipY-9.5); c.lineTo(mx, lipY-5.2); c.stroke();
}

function drawEar(c, side, yawv, back, flick, scaleF){
  /* side: -1 left, +1 right */
  var far = clamp(-yawv*side, 0, 1);
  var near = clamp(yawv*side, 0, 1);
  var bx = side*D.earX + yawv*8;
  var by = D.earY + Math.abs(yawv)*2;
  var baseA = side*0.30 + back*side*0.62 + flick;
  var sx = (1 - far*0.52 + near*0.10) * scaleF;
  var sy = (1 - back*0.16 - far*0.06) * scaleF;
  c.save();
  c.translate(bx,by);
  c.rotate(baseA);
  c.scale(side*sx, sy);
  /* outline */
  c.beginPath();
  crClosed(c, EAR.map(function(p){return pt(p.x*1.10, p.y*1.06-1.2);}), 1);
  c.fillStyle=C.line; c.fill();
  /* outer */
  c.beginPath(); crClosed(c, EAR, 1);
  var eg=c.createLinearGradient(-14,4,12,-38);
  eg.addColorStop(0,C.coatSh); eg.addColorStop(0.55,C.coatMid); eg.addColorStop(1,C.coatDeep);
  c.fillStyle=eg; c.fill();
  /* inner */
  c.beginPath();
  crClosed(c, [pt(-7,1),pt(-6.5,-15),pt(-1.5,-27),pt(4,-27),pt(8.5,-14),pt(9,1)], 1);
  c.fillStyle=C.inner; c.fill();
  c.beginPath();
  crClosed(c, [pt(-4,0),pt(-3.6,-12),pt(0,-21),pt(3,-21),pt(5.6,-11),pt(6,0)], 1);
  c.fillStyle='rgba(255,236,225,0.55)'; c.fill();
  c.restore();
}

function drawFace(c){
  var yawv=PO.yaw, pitchv=PO.pitch;
  var open=PO.eyeOpenEff, smi=clamp(P.eyeSmile.x,0,1);
  var fEye = yawv*14, fMuz = yawv*20, fBrow = yawv*16;
  var vEye = -pitchv*11, vMuz = -pitchv*10, vBrow = -pitchv*9;

  /* --- cream cheek patches (urajiro) --- */
  /* when the head turns to +x the LEFT side of the face rotates away from us,
     so the left-hand features are the ones that foreshorten */
  var fl = clamp(yawv,0,1), fr = clamp(-yawv,0,1);
  c.fillStyle=C.creamMid; c.globalAlpha=0.92;
  ell(c, -29+yawv*15, 16+vMuz*0.5, 12.5-fl*4, 10.5, -0.22); c.fill();
  ell(c,  29+yawv*15, 16+vMuz*0.5, 12.5-fr*4, 10.5, 0.22); c.fill();
  c.globalAlpha=1;

  /* --- muzzle --- */
  var mcx = fMuz, mcy = D.muzY + vMuz;
  c.save(); c.translate(mcx, mcy);
  c.scale(1 - Math.abs(yawv)*0.10, 1);
  c.beginPath(); crClosed(c, MUZ, 1); c.fillStyle=G.muz; c.fill();
  c.strokeStyle='rgba(198,150,104,0.45)'; c.lineWidth=1.4; c.stroke();
  c.restore();

  /* --- brow markings --- */
  var brw = P.brow.x;
  c.fillStyle=C.creamMid;
  c.globalAlpha=0.92;
  ell(c, -D.browX+fBrow, D.browY+vBrow-brw*2.5, 10-fl*3, 6+brw*1.1, -0.30); c.fill();
  ell(c,  D.browX+fBrow, D.browY+vBrow-brw*2.5, 10-fr*3, 6+brw*1.1, 0.30); c.fill();
  c.globalAlpha=1;

  /* --- eyes --- */
  var eyLx = -D.eyeX + fEye, eyRx = D.eyeX + fEye;
  var eyY = D.eyeY + vEye;
  drawEye(c, eyLx, eyY, D.eyeW*(1-fl*0.30), D.eyeH, open, smi, 0.09, -1);
  drawEye(c, eyRx, eyY, D.eyeW*(1-fr*0.30), D.eyeH, open, smi, 0.09,  1);

  /* --- nose --- */
  var nsx = mcx + P.noseTw.x*1.4, nsy = mcy - 7 + Math.abs(P.noseTw.x)*0.6;
  c.save(); c.translate(nsx,nsy);
  c.beginPath();
  crClosed(c, [pt(0,-5.6),pt(6.4,-4.4),pt(7.2,1.2),pt(3.0,5.4),pt(0,6.0),
               pt(-3.0,5.4),pt(-7.2,1.2),pt(-6.4,-4.4)], 1);
  c.fillStyle=C.nose; c.fill();
  c.fillStyle='rgba(255,255,255,0.32)';
  ell(c, -2.2,-2.4, 2.8,1.7, -0.4); c.fill();
  c.restore();

  /* --- mouth --- */
  drawMouth(c, mcx, mcy + 8, clamp(P.mouth.x,0,1), clamp(P.smile.x,0,1), clamp(P.tongue.x,0,1.4));

  /* --- blush when very happy --- */
  var bl = clamp((affection-0.42)/0.58,0,1)*0.5 + pet.x*0.35;
  if(bl>0.03){
    c.fillStyle='rgba(240,130,132,'+(0.30*clamp(bl,0,1)).toFixed(3)+')';
    ell(c, -34+yawv*14, 5+vEye*0.6, 11, 6.4, -0.2); c.fill();
    ell(c,  34+yawv*14, 5+vEye*0.6, 11, 6.4, 0.2); c.fill();
  }
}

function drawPuppy(c){
  var i, t;
  c.save();
  c.translate(P.px, P.py);
  c.scale(P.s, P.s);
  if(!G.body) initGrads(c);

  var sit=PO.sit;

  /* ---- contact shadow ---- */
  c.save();
  var shSpread = 1 + P.sit.x*0.10 + P.squash.x*0.20;
  c.translate(PO.bodyX*0.45, 0);
  c.scale(shSpread, 0.26*(1 - clamp(P.lift.x,0,20)/70));
  c.fillStyle=G.shadow;
  c.beginPath(); c.arc(0,0,58,0,TAU); c.fill();
  c.restore();

  /* ---- tail (behind) ---- */
  drawTail(c);

  /* ---- hind legs (behind body) ---- */
  var hipY = PO.bodyY + PO.bodyHH*0.72;
  var kick = Math.sin(P.kickPhase)*P.hindKick.x;
  drawLeg(c, PO.bodyX-36, hipY-6, PO.bodyX-44, -5+sit*3 - Math.max(0,kick)*7,
          -(4+sit*15), 10.5, true, 1);
  drawLeg(c, PO.bodyX+36, hipY-6, PO.bodyX+44, -5+sit*3 + Math.min(0,kick)*7,
          (4+sit*15), 10.5, true, 1);

  /* haunch (reads as "sitting") */
  if(sit>0.02){
    c.globalAlpha=clamp(sit,0,1);
    c.fillStyle=C.line;
    ell(c, PO.bodyX+PO.bodyHW*0.80, hipY-14, 21, 24, 0.12); c.fill();
    ell(c, PO.bodyX-PO.bodyHW*0.80, hipY-14, 21, 24, -0.12); c.fill();
    c.fillStyle=C.coatMid;
    ell(c, PO.bodyX+PO.bodyHW*0.80, hipY-15, 19, 22, 0.12); c.fill();
    ell(c, PO.bodyX-PO.bodyHW*0.80, hipY-15, 19, 22, -0.12); c.fill();
    c.globalAlpha=1;
  }

  /* ---- body ---- */
  var sxB = PO.bodyHW/52, syB = PO.bodyHH/43;
  c.save();
  c.translate(PO.bodyX, PO.bodyY);
  c.rotate(PO.bodyRot);
  /* outline */
  c.beginPath();
  defPath(c, BODY, PO.bodyX, PO.bodyY, sxB*1.045, syB*1.045, 1.0);
  c.fillStyle=C.line; c.fill();
  /* lineart pass for the fur clumps: drawn UNDER the fill so only the outer
     half of their outline survives -> they merge into the silhouette */
  c.fillStyle=C.line;
  for(i=0;i<TUFTS.length;i++){
    t=TUFTS[i];
    if(t.p!==0) continue;
    drawTuft(c, t.x*sxB, t.y*syB, t.a + t.sp.x, t.l*1.14, t.w*1.28, t.curl + t.sp.x*7);
    c.fill();
  }
  /* fill */
  c.beginPath();
  defPath(c, BODY, PO.bodyX, PO.bodyY, sxB, syB, 1.0);
  c.fillStyle=G.body; c.fill();
  c.save(); c.clip();
  /* form shading */
  c.fillStyle=G.bodyShade; c.fillRect(-70,-70,140,140);
  /* saddle: darker back */
  c.fillStyle='rgba(150,76,34,0.16)';
  ell(c, 0, -34*syB, 44*sxB, 20*syB); c.fill();
  /* cream bib */
  c.beginPath();
  defPath(c, BIB, PO.bodyX, PO.bodyY, sxB, syB, 0.75);
  c.fillStyle=G.bib; c.fill();
  /* bib soft edge */
  c.strokeStyle='rgba(226,190,142,0.6)'; c.lineWidth=2; c.stroke();
  /* rim light from the window (upper right) */
  c.fillStyle=G.rim; c.fillRect(-70,-70,140,140);
  c.restore();
  /* fur clump fills (still in body space, over the body colour) */
  c.fillStyle=C.coatHi;
  for(i=0;i<TUFTS.length;i++){
    t=TUFTS[i];
    if(t.p!==0) continue;
    drawTuft(c, t.x*sxB, t.y*syB, t.a + t.sp.x, t.l, t.w, t.curl + t.sp.x*7);
    c.fill();
  }
  c.restore();

  /* ---- front legs ---- */
  var fHipY = PO.bodyY + PO.bodyHH*0.80;
  for(i=0;i<2;i++){
    var sd = i===0?-1:1;
    var lf = P.pawLift[i].x;
    var pawX = PO.bodyX + sd*21 + sd*sit*2 + lf*sd*3;
    var pawY = -1 + sit*6 - lf*16;
    drawLeg(c, PO.bodyX + sd*19, fHipY-4, pawX, pawY, sd*(2.5+sit*3+lf*7), 11, false, 1+lf*0.06);
  }

  /* ---- soft cream chest ruff over the leg tops ---- */
  c.save(); c.translate(PO.bodyX, PO.bodyY);
  c.fillStyle=C.creamMid;
  ell(c, 0, 32*syB, 16*sxB, 11*syB); c.fill();
  c.fillStyle=C.creamSh; c.globalAlpha=0.75;
  ell(c, -10*sxB, 37*syB, 8*sxB, 6*syB, -0.30); c.fill();
  ell(c,  10*sxB, 37*syB, 8*sxB, 6*syB,  0.30); c.fill();
  c.globalAlpha=1;
  c.restore();

  /* ---- soft occlusion shadow where the head meets the chest ---- */
  c.save();
  c.globalAlpha=0.16; c.fillStyle='#6b3a24';
  ell(c, PO.headX*0.85, PO.headY+50, 31, 15); c.fill();
  c.globalAlpha=1;
  c.restore();

  /* ---- head group ---- */
  c.save();
  c.translate(PO.headX, PO.headY);
  c.rotate(PO.headRot);

  var farIsLeft = PO.yaw < 0;
  var earScale = 1 + P.perk.x*0.06;
  /* far ear behind the head */
  if(farIsLeft) drawEar(c, -1, PO.yaw, P.earBack.x, P.earL.x, earScale);
  else          drawEar(c,  1, PO.yaw, P.earBack.x, P.earR.x, earScale);

  /* head silhouette */
  var yawSkew = PO.yaw*6.5;
  var hpts=[], hpts2=[];
  for(i=0;i<HEAD.length;i++){
    var hx0 = HEAD[i].x + yawSkew*(1 - Math.abs(HEAD[i].x)/47*0.45);
    var hy0 = HEAD[i].y * (1 - PO.pitch*0.07) - PO.pitch*3.0;
    hpts.push(pt(hx0,hy0));
  }
  c.beginPath();
  defPath(c, hpts, PO.headX, PO.headY, 1.045, 1.045, 1.0);
  c.fillStyle=C.line; c.fill();
  c.fillStyle=C.line;
  for(i=0;i<TUFTS.length;i++){
    t=TUFTS[i];
    if(t.p!==1) continue;
    drawTuft(c, t.x+yawSkew*0.6, t.y, t.a + t.sp.x, t.l*1.14, t.w*1.28, t.curl + t.sp.x*6);
    c.fill();
  }
  c.beginPath();
  defPath(c, hpts, PO.headX, PO.headY, 1, 1, 1.0);
  c.fillStyle=G.head; c.fill();
  c.save(); c.clip();
  /* head form shading */
  var hs=c.createLinearGradient(0,-46,0,44);
  hs.addColorStop(0,'rgba(255,244,214,0.30)');
  hs.addColorStop(0.44,'rgba(255,244,214,0)');
  hs.addColorStop(1,'rgba(150,76,34,0.22)');
  c.fillStyle=hs; c.fillRect(-60,-60,120,120);
  /* darker mask around the top of the head */
  c.fillStyle='rgba(150,76,34,0.13)';
  ell(c, yawSkew, -34, 34, 16); c.fill();
  drawFace(c);
  c.fillStyle=G.rim; c.fillRect(-60,-60,120,120);
  c.restore();

  /* head fur tufts (cheek floof etc.) */
  for(i=0;i<TUFTS.length;i++){
    t=TUFTS[i];
    if(t.p!==1) continue;
    c.fillStyle = C.coatHi;   /* fur-coloured: reads as a soft scalloped edge */
    drawTuft(c, t.x+yawSkew*0.6, t.y, t.a + t.sp.x, t.l, t.w, t.curl + t.sp.x*6);
    c.fill();
  }

  /* near ear in front */
  if(farIsLeft) drawEar(c,  1, PO.yaw, P.earBack.x, P.earR.x, earScale);
  else          drawEar(c, -1, PO.yaw, P.earBack.x, P.earL.x, earScale);

  c.restore(); /* head group */

  c.restore(); /* puppy */
}

var zoneList=[];
function computeZones(){
  var tn = PO.tailNodes;
  var tm = tn.length>3 ? tn[3] : pt(70,-130);
  zoneList.length=0;
  zoneList.push({id:'muz',   x:PO.muzX, y:PO.muzY, r:25});
  zoneList.push({id:'head',  x:PO.headX, y:PO.headY-6, r:48});
  zoneList.push({id:'tail',  x:tm.x+4, y:tm.y+4, r:31});
  zoneList.push({id:'back',  x:PO.bodyX, y:PO.bodyY-PO.bodyHH*0.72, r:40});
  zoneList.push({id:'belly', x:PO.bodyX, y:PO.bodyY+PO.bodyHH*0.52, r:40});
  zoneList.push({id:'paw',   x:PO.bodyX, y:-8, r:28});
}
function hitZone(lx,ly){
  var best=null, bd=1e9, i, z, d;
  for(i=0;i<zoneList.length;i++){
    z=zoneList[i];
    d=Math.hypot(lx-z.x, ly-z.y)/z.r;
    if(d<bd){ bd=d; best=z; }
  }
  return (bd<1.16) ? {zone:best, d:bd} : null;
}

var parts=[];
function heartPath(c,x,y,s,rot){
  c.save(); c.translate(x,y); c.rotate(rot); c.scale(s,s);
  c.beginPath();
  c.moveTo(0,0.62);
  c.bezierCurveTo(-1.04,-0.16,-0.66,-1.06,0,-0.44);
  c.bezierCurveTo(0.66,-1.06,1.04,-0.16,0,0.62);
  c.closePath();
  c.restore();
}
function sparkPath(c,x,y,s,rot){
  c.save(); c.translate(x,y); c.rotate(rot);
  c.beginPath();
  c.moveTo(0,-s);
  c.quadraticCurveTo(s*0.17,-s*0.17, s,0);
  c.quadraticCurveTo(s*0.17,s*0.17, 0,s);
  c.quadraticCurveTo(-s*0.17,s*0.17, -s,0);
  c.quadraticCurveTo(-s*0.17,-s*0.17, 0,-s);
  c.closePath(); c.restore();
}
function spawn(kind, x, y, s){
  if(parts.length>44) parts.shift();
  parts.push({k:kind, x:x, y:y, s:s,
    vx:rr(-13,13), vy:rr(-34,-58),
    life:0, dur:(kind===0?rr(1.5,2.3):rr(0.7,1.15)),
    rot:rr(-0.4,0.4), rv:rr(-1.4,1.4), ph:rr(0,TAU),
    hue:rnd()<0.35?1:0 });
}
function ringPuff(x,y){
  parts.push({k:2, x:x, y:y, s:6, vx:0, vy:0, life:0, dur:0.5, rot:0, rv:0, ph:0, hue:0});
}
function updateParts(dt){
  var i,p;
  for(i=parts.length-1;i>=0;i--){
    p=parts[i]; p.life+=dt;
    if(p.life>=p.dur){ parts.splice(i,1); continue; }
    if(p.k!==2){
      var u=p.life/p.dur;
      p.x += (p.vx + Math.sin(p.ph + p.life*3.1)*15)*dt;
      p.y += p.vy*dt;
      p.vy += 9*dt;              /* slight deceleration of the rise */
      p.rot += p.rv*dt;
    }
  }
}
function drawParts(c){
  var i,p,u,a,s;
  for(i=0;i<parts.length;i++){
    p=parts[i]; u=p.life/p.dur;
    if(p.k===0){
      a = (u<0.16? smooth(u/0.16) : 1-smooth((u-0.16)/0.84));
      s = p.s * (u<0.18 ? easeOutBack(u/0.18,2.4) : 1+ (u-0.18)*0.30);
      c.globalAlpha = a*0.94;
      heartPath(c, p.x, p.y, s, p.rot + Math.sin(p.ph+p.life*2.2)*0.16);
      c.fillStyle = p.hue? C.heart2 : C.heart; c.fill();
      c.globalAlpha = a*0.5; c.lineWidth=1.4; c.strokeStyle='rgba(255,255,255,0.8)';
      heartPath(c, p.x-p.s*0.22, p.y-p.s*0.30, s*0.30, p.rot); c.fill();
    } else if(p.k===1){
      a = hump(u);
      c.globalAlpha = a*0.95;
      sparkPath(c, p.x, p.y, p.s*(0.5+a*0.8), p.rot+p.life*2.0);
      c.fillStyle = p.hue? '#fff4c8' : '#ffe9a8'; c.fill();
    } else {
      a = 1-u;
      c.globalAlpha = a*0.5;
      c.strokeStyle='rgba(255,240,205,0.95)'; c.lineWidth=2.4*a;
      ell(c, p.x, p.y, p.s+u*26, (p.s+u*26)*0.34); c.stroke();
    }
  }
  c.globalAlpha=1;
}

var motes=[];
(function(){

function drawMotes(c, dt){
  var i,m;
  c.fillStyle='#fff3ce';
  for(i=0;i<motes.length;i++){
    m=motes[i];
    m.y -= m.sp*dt*0.5;
    m.x -= m.sp*dt*0.30;
    m.ph += dt*1.7;
    if(m.y < 90){ m.y = 790; m.x = rr(60, 380); }
    if(m.x < -20){ m.x = 380; }
    /* only visible inside the beam-ish band */
    var band = clamp(1 - Math.abs((m.x + (m.y-140)*0.42) - 300)/210, 0, 1);
    c.globalAlpha = m.a * band * (0.55+0.45*Math.sin(m.ph));
    if(c.globalAlpha>0.01){ ell(c, m.x, m.y, m.r, m.r); c.fill(); }
  }
  c.globalAlpha=1;
}

var act=null, actT=0, actName='', lastAct='', nextIdleIn=1.6;
var cool={};
var earNext=2.4, blinkNext=1.8;
var idleFlags={};

function startAct(name){
  actName=name; actT=0; lastAct=name;
  idleFlags={};
  act = ACTS[name];
  cool[name] = act.cd;
  if(act.init) act.init();
}
function doBlink(n){
  if(P.blinkT<=0){ P.blinkT=P.blinkDur; P.blinkQ=(n||1)-1; }
}

var ACTS = {
  lookAround:{ dur:3.4, cd:5.5, w:function(){return 3.2;},
    init:function(){
      var a=POI[ri(0,POI.length-1)], b=POI[ri(0,POI.length-1)];
      idleFlags.a=a; idleFlags.b=b;
    },
    up:function(u,dt){
      var a=idleFlags.a, b=idleFlags.b;
      if(u<0.10){ }
      else if(u<0.42){ lookAtVirtual(a.x,a.y); }
      else if(u<0.76){ lookAtVirtual(b.x,b.y); if(!idleFlags.bk){idleFlags.bk=1; doBlink(1);} }
      else { gaze.yaw = approach(gaze.yaw,0,6,dt); gaze.pitch=approach(gaze.pitch,0.05,6,dt); }
      P.perk.to(0.18);
      P.earBack.to(-0.05);
    }},

  headTilt:{ dur:2.6, cd:7.5, w:function(){return 2.4;},
    init:function(){ idleFlags.d = rnd()<0.5?-1:1; },
    up:function(u,dt){
      var env = plateau(u,0.20,0.34);
      P.tilt.to(idleFlags.d*0.26*env);
      P.yaw.t = P.yaw.t + idleFlags.d*0.10*env;
      P.eyeOpen.to(1.06);
      P.brow.to(0.45*env);
      P.perk.to(0.22*env);
      if(u>0.30 && !idleFlags.bk){ idleFlags.bk=1; doBlink(1); }
    }},

  yawn:{ dur:2.9, cd:22, w:function(){return affection<0.5?2.0:0.7;},
    up:function(u,dt){
      if(u<0.16){                       /* anticipation: gather */
        var a=smooth(u/0.16);
        P.squash.to(0.05*a); P.headLift.to(-3*a); P.eyeOpen.to(1-0.35*a);
      } else if(u<0.52){                /* the yawn */
        var b=smooth((u-0.16)/0.36);
        P.mouth.to(0.30+0.70*hump(b*0.96));
        P.tongue.to(0.85*hump(b));
        P.eyeOpen.to(0.06);
        P.eyeSmile.to(0.55);
        P.headLift.to(9*b); P.pitch.t = 0.48*b;
        P.squash.to(-0.075*b);
        P.earBack.to(0.55*b);
        P.brow.to(0.7*b);
        P.wagAmp.to(0.05);
      } else if(u<0.78){                /* settle / follow-through */
        var d=smooth((u-0.52)/0.26);
        P.mouth.to(0.30*(1-d)); P.tongue.to(0.2*(1-d));
        P.eyeOpen.to(0.10+0.95*d);
        P.eyeSmile.to(0.55*(1-d));
        P.headLift.to(9*(1-d)-2.5*d);
        P.squash.to(-0.075*(1-d)+0.05*d);
        P.earBack.to(0.55*(1-d));
        if(d>0.5 && !idleFlags.bk){ idleFlags.bk=1; doBlink(2); }
      } else {
        var e=smooth((u-0.78)/0.22);
        P.squash.to(0.05*(1-e));
        P.headLift.to(-2.5*(1-e));
      }
    }},

  shake:{ dur:1.9, cd:15, w:function(){return 1.6;},
    up:function(u,dt){
      if(u<0.16){                        /* anticipation */
        var a=smooth(u/0.16);
        P.squash.to(0.06*a); P.tilt.to(-0.10*a); P.earBack.to(0.2*a);
        P.eyeOpen.to(1-0.55*a);
      } else if(u<0.68){
        var b=(u-0.16)/0.52;
        var env=Math.exp(-b*2.1)*(1-smooth(Math.max(0,(b-0.75)/0.25)));
        var f=Math.sin(b*TAU*5.6);
        P.tilt.to(f*0.30*env);

      } else {
        var d=smooth((u-0.68)/0.32);

  sitDown:{ dur:1.7, cd:16, w:function(){return P.sit.t<0.5?1.5:0;},
    up:function(u,dt){

  askAttention:{ dur:3.0, cd:11, w:function(){return sinceTouch>9? 3.4:0.4;},

var ACTNAMES=[];
for(var _k in ACTS) if(ACTS.hasOwnProperty(_k)) ACTNAMES.push(_k);

var sinceTouch=0;
function chooseAct(){
  var i, n, tot=0, ws=[];
  for(i=0;i<ACTNAMES.length;i++){
    n=ACTNAMES[i];
    var w = ACTS[n].w();
    if((cool[n]||0)>0) w=0;
    if(n===lastAct) w*=0.18;
    ws.push(w); tot+=w;
  }
  if(tot<=0.0001) return null;
  var r=rnd()*tot, acc=0;
  for(i=0;i<ACTNAMES.length;i++){
    acc+=ws[i];
    if(r<=acc) return ACTNAMES[i];
  }
  return ACTNAMES[0];
}

function runDirector(dt){
  var n;
  for(n in cool) if(cool.hasOwnProperty(n) && cool[n]>0) cool[n]-=dt;

  /* blink lane (independent, always alive) */
  blinkNext -= dt;
  if(blinkNext<=0){
    if(P.blinkT<=0 && !(act && (actName==='yawn'||actName==='shake'))){
      doBlink(rnd()<0.20?2:1);
    }
    blinkNext = rr(1.5,5.4) * (1 - clamp(pet.x,0,1)*0.45);
  }
  /* ear lane */
  earNext -= dt;
  if(earNext<=0){
    var s = rnd()<0.5?-1:1;
    (s<0?P.earL:P.earR).kick(rr(3.0,5.4)*(rnd()<0.5?-1:1));
    if(rnd()<0.3) (s<0?P.earR:P.earL).kick(rr(-2,2));
    earNext = rr(1.9,6.2);
  }

  /* petting suppresses major idles */
  if(pet.x>0.14 || IN.down){
    if(act && actName!=='sitDown' && actName!=='standUp'){ act=null; }
    nextIdleIn = rr(0.7,1.6);
    return;
  }

  if(act){
    actT += dt;
    var u = actT/act.dur;
    if(u>=1){ act=null; nextIdleIn = rr(0.9,3.1); }
    else act.up(u, dt);
  } else {
    nextIdleIn -= dt;
    if(nextIdleIn<=0){
      var pickName = chooseAct();
      if(pickName) startAct(pickName);
      else nextIdleIn = 0.6;
    }
  }
}

/* ============================================================
   13. BASE POSE  (mood-driven neutral) + PETTING OVERLAY
   ============================================================ */
function baseTargets(dt){
  var m = clamp(affection,0,1);
  gaze.t += dt;
  /* micro saccades + slow gaze drift so the stare is never dead */
  var sy = fbm(gaze.t*0.33+7)*0.14, sp = fbm(gaze.t*0.29+19)*0.10;
  P.yaw.to(clamp(gaze.yaw + sy, -1.3, 1.3));
  P.pitch.to(clamp(gaze.pitch + sp + 0.03, -1.0, 1.0));
  P.tilt.to(fbm(gaze.t*0.21+3)*0.035);
  P.headLift.to(0);
  P.headPush.to(0);
  P.eyeOpen.to(1 + m*0.05);
  P.eyeSmile.to(m*0.20);
  P.brow.to(m*0.22);
  P.smile.to(0.34 + m*0.44);
  P.mouth.to(m>0.55 ? 0.06+0.05*Math.sin(P.t*6.2) : 0);
  P.tongue.to(0);
  P.noseTw.to(0);
  P.earBack.to(-m*0.05);
  P.perk.to(m*0.30);
  P.melt.to(0);
  P.squash.to(0);
  P.sway.to(0);
  P.roll.to(0);
  P.lift.to(0);
  P.tailUp.to(m*0.20);
  P.wagAmp.to(0.09 + m*0.20);
  P.wagSpd.to(1.5 + m*3.4);
  P.hindKick.to(0);
  P.pawLift[0].to(0); P.pawLift[1].to(0);
}

function applyPetting(dt){
  var i, zid;
  /* stroke energy decay */
  strokeE = approach(strokeE, 0, 3.4, dt);
  if(strokeHold>0){ strokeHold-=dt; } else if(!IN.down){ IN.zone=''; }
  var act1 = (IN.down && IN.on) ? IN.zone : (strokeHold>0 ? IN.zone : '');
  var e = clamp(strokeE, 0, 1);

  pet.to(e); pet.step(dt);
  for(zid in ZS){ if(ZS.hasOwnProperty(zid)){
    ZS[zid].to(zid===act1 ? e : 0);
    ZS[zid].step(dt);
  }}
  IN.glow.to(IN.down?1:0); IN.glow.step(dt);

  var pv = pet.x;
  if(pv<0.004 && zHead.x<0.004 && zBelly.x<0.004 && zTail.x<0.004
     && zBack.x<0.004 && zMuz.x<0.004 && zPaw.x<0.004) return;

  var m=clamp(affection,0,1);

  /* ---------- global bliss ---------- */
  P.melt.to(pv*(0.55 + zHead.x*0.35 + zBack.x*0.25));
  P.squash.to(pv*0.05 + zBack.x*0.04);
  P.wagAmp.to(0.09 + m*0.20 + pv*0.34 + zTail.x*0.20 + zBelly.x*0.14);
  P.wagSpd.to(1.5 + m*3.4 + pv*7.5 + zTail.x*4.5 + zBelly.x*3.0);
  P.eyeSmile.to(clamp(m*0.20 + pv*0.85, 0, 1));
  P.eyeOpen.to(clamp(1 - pv*0.80 + zMuz.x*0.5, 0.06, 1.1));
  P.smile.to(clamp(0.34 + m*0.44 + pv*0.55, 0, 1));
  P.brow.to(clamp(m*0.22 + pv*0.55,0,1));
  P.earBack.to(pv*(0.62 + zHead.x*0.28));
  P.perk.to(m*0.30 - pv*0.12);
  P.tailUp.to(m*0.20 + pv*0.30 + zTail.x*0.30);
  if(m>0.34 || pv>0.5){
    P.mouth.to(0.14 + 0.10*Math.sin(P.t*8.4) + pv*0.10);
    P.tongue.to(clamp(0.35 + m*0.45,0,1));
  }

  /* ---------- head: lean into the hand ---------- */
  if(zHead.x>0.004){
    var z=zHead.x;
    var dxh = clamp((IN.lx - PO.headX)/46, -1.2, 1.2);
    var dyh = clamp((IN.ly - (PO.headY-6))/46, -1.2, 1.2);
    P.yaw.t   = clamp(P.yaw.t*(1-z) + dxh*1.15*z, -1.3, 1.3);
    P.pitch.t = clamp(P.pitch.t*(1-z) + (0.30 - dyh*0.42)*z, -1.0, 1.0);
    P.headPush.to(z*(0.5 + dxh*0.5));
    P.headLift.to(-z*3.5);
    P.tilt.to(P.tilt.t*(1-z) + clamp(dxh*0.30,-0.34,0.34)*z);
    P.eyeOpen.to(clamp(1-z*0.92, 0.05, 1));
    P.melt.to(Math.max(P.melt.t, z*0.85));
  }

  /* ---------- back / shoulders ---------- */
  if(zBack.x>0.004){
    var zb=zBack.x;
    P.squash.to(P.squash.t + zb*0.075);
    P.roll.to(P.roll.t + clamp((IN.lx-PO.bodyX)/60,-1,1)*0.045*zb);
    P.pitch.t = P.pitch.t*(1-zb*0.6) + 0.22*zb;
    P.tailUp.to(P.tailUp.t + zb*0.28);
  }

  /* ---------- belly / chest: sit back, hind-leg twitch, pant ---------- */
  if(zBelly.x>0.004){
    var zl=zBelly.x;
    P.sit.to(Math.max(P.sit.t, clamp(zl*1.4,0,1)));
    P.pitch.t = P.pitch.t*(1-zl) + 0.62*zl;
    P.headLift.to(P.headLift.t + zl*5);
    P.hindKick.to(zl*0.95);
    P.mouth.to(Math.max(P.mouth.t, 0.24+0.16*Math.sin(P.t*11.5)));
    P.tongue.to(Math.max(P.tongue.t, 0.85));
    P.eyeSmile.to(Math.max(P.eyeSmile.t, zl*0.8));
    P.eyeOpen.to(clamp(1-zl*0.7,0.1,1));
    P.roll.to(P.roll.t - zl*0.035);
    P.earBack.to(Math.max(P.earBack.t, zl*0.5));
  }

  /* ---------- tail / rump: wiggle, look back ---------- */
  if(zTail.x>0.004){
    var zt=zTail.x;
    P.yaw.t = clamp(P.yaw.t*(1-zt) + 1.15*zt, -1.3, 1.3);
    P.tilt.to(P.tilt.t*(1-zt) + 0.16*zt);
    P.pitch.t = P.pitch.t*(1-zt*0.7) + 0.10*zt;
    P.eyeSmile.to(Math.max(P.eyeSmile.t, zt*0.75));
    P.eyeOpen.to(clamp(1-zt*0.55,0.15,1));
    P.squash.to(P.squash.t + zt*0.05);
  }

  /* ---------- muzzle: sniff + lick the finger ---------- */
  if(zMuz.x>0.004){
    var zm=zMuz.x;
    var dxm = clamp((IN.lx - PO.muzX)/34,-1.2,1.2);
    var dym = clamp((IN.ly - PO.muzY)/34,-1.2,1.2);
    P.yaw.t = clamp(P.yaw.t*(1-zm) + dxm*0.85*zm, -1.3,1.3);
    P.pitch.t = P.pitch.t*(1-zm) + (0.12 - dym*0.5)*zm;
    P.noseTw.to(Math.sin(P.t*46)*0.95*zm);
    P.mouth.to(Math.max(P.mouth.t, 0.30+0.22*Math.abs(Math.sin(P.t*7.2))));
    P.tongue.to(Math.max(P.tongue.t, 0.7+0.30*Math.abs(Math.sin(P.t*7.2))));
    P.eyeOpen.to(clamp(1-zm*0.45,0.2,1));
    P.eyeSmile.to(Math.max(P.eyeSmile.t, zm*0.5));
    P.headLift.to(P.headLift.t - zm*2);
  }

  /* ---------- paws ---------- */
  if(zPaw.x>0.004){
    var zp=zPaw.x;
    var side = (IN.lx < PO.bodyX) ? 0 : 1;
    P.pawLift[side].to(zp*0.9);
    P.pitch.t = P.pitch.t*(1-zp) + (-0.42)*zp;
    P.headLift.to(P.headLift.t - zp*4);
    P.eyeOpen.to(clamp(1-zp*0.2,0.3,1.1));
    P.tilt.to(P.tilt.t + (side?0.14:-0.14)*zp);
  }
}

function toVirtual(cx,cy){
  var r=cv.getBoundingClientRect();
  return {x:(cx-r.left-offX)/VS, y:(cy-r.top-offY)/VS};
}
function toLocal(v){
  return {x:(v.x-P.px)/P.s, y:(v.y-P.py)/P.s};
}
var hintStage=0;
function bumpHint(){
  var h=document.getElementById('hint');
  if(hintStage===0 && affection>0.30){ hintStage=1; h.textContent='Try the belly, the tail, the nose'; }
  else if(hintStage===1 && affection>0.80){ hintStage=2; h.textContent='She loves you'; }
}

function onDown(ev){
  if(IN.down) return;
  IN.down=true; IN.id=ev.pointerId;
  var v=toVirtual(ev.clientX, ev.clientY);
  IN.vx=v.x; IN.vy=v.y; IN.lvx=v.x; IN.lvy=v.y;
  var l=toLocal(v); IN.lx=l.x; IN.ly=l.y; IN.plx=l.x; IN.ply=l.y;
  IN.lastPressX=l.x; IN.lastPressY=l.y;
  IN.dist=0; IN.downT=0; IN.moved=false;
  sinceTouch=0;
  var h=hitZone(l.x,l.y);
  IN.on = !!h;
  IN.zone = h?h.zone.id:'';
  if(IN.on){
    strokeHold=0.5;
    strokeE = Math.max(strokeE, 0.22);
    addPress(l.x,l.y, 0,0, 0.55, 30);
    P.earL.kick(1.2); P.earR.kick(-1.2);
  } else {
    ringPuff(v.x, v.y);
    lookAtVirtual(v.x, v.y);
    act=null; nextIdleIn=rr(1.4,2.6);
    P.earL.kick(-2.6); P.earR.kick(2.6);
    P.perk.kick(2.2);
    P.eyeOpen.kick(1.6);
    doBlink(1);
    P.wagAmp.kick(0.6); P.wagSpd.kick(4);
  }
  try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
  ev.preventDefault();
}

function onMove(ev){
  if(!IN.down || ev.pointerId!==IN.id) return;
  var v=toVirtual(ev.clientX, ev.clientY);
  var l=toLocal(v);
  var dxl = l.x-IN.lx, dyl = l.y-IN.ly;
  var seg = Math.hypot(dxl,dyl);
  IN.vx=v.x; IN.vy=v.y; IN.lx=l.x; IN.ly=l.y;
  IN.dist += seg;
  if(IN.dist>5) IN.moved=true;

  var h=hitZone(l.x,l.y);
  IN.on=!!h;
  if(h){
    if(h.zone.id!==IN.zone){
      IN.zone=h.zone.id;
      P.earL.kick(0.7); P.earR.kick(-0.7);
    }
    strokeHold=0.42;
    /* stroke intensity from travelled distance (frame-rate independent) */
    var gain = clamp(seg/9.0, 0, 1.25);
    strokeE = clamp(Math.max(strokeE, 0.30) + gain*0.55, 0, 1.32);

    /* deformation impulse */
    var pd = Math.hypot(l.x-IN.lastPressX, l.y-IN.lastPressY);
    if(pd>3.2 && seg>0.01){
      var ux=dxl/seg, uy=dyl/seg;
      var mag = clamp(seg*0.85, 1.2, 8.0);
      addPress(l.x, l.y, ux*mag, uy*mag, clamp(0.35+seg*0.06,0.3,1.0),
               IN.zone==='head'?30:(IN.zone==='muz'?20:34));
      IN.lastPressX=l.x; IN.lastPressY=l.y;
      /* ruffle nearby fur tufts */
      for(var i=0;i<TUFTS.length;i++){
        var t=TUFTS[i];
        var tx = t.p===0 ? PO.bodyX + t.x*(PO.bodyHW/52) : PO.headX + t.x;
        var ty = t.p===0 ? PO.bodyY + t.y*(PO.bodyHH/43) : PO.headY + t.y;
        var dd = (tx-l.x)*(tx-l.x)+(ty-l.y)*(ty-l.y);
        var ff = Math.exp(-dd/1500);
        if(ff>0.02){
          var tangential = (-Math.sin(t.a)*ux + Math.cos(t.a)*uy);
          t.sp.kick(tangential*ff*mag*0.85);
        }
      }
    }

    /* affection accrues per unit stroked */
    var mult = ZMULT[IN.zone]||1;
    affection = clamp(affection + Math.min(seg,14)*0.00075*mult, 0, 1);
    affFloor = Math.max(affFloor, affection*0.62);
    affPulse = Math.min(1, affPulse + Math.min(seg,14)*0.004);
    bumpHint();

    /* hearts + sparkles */
    if(rnd() < seg*0.030*(0.5+affection)){
      var hv=headVirtual();
      var sx0 = P.px + l.x*P.s + rr(-10,10);
      var sy0 = P.py + l.y*P.s + rr(-8,8);
      if(rnd()<0.72) spawn(0, sx0, sy0, rr(6.5,11)*(0.7+affection*0.6));
      else spawn(1, sx0, sy0, rr(3,5.5));
    }
  }
  ev.preventDefault();
}

function onUp(ev){
  if(!IN.down || (ev.pointerId!==IN.id && ev.type!=='pointercancel')) return;
  IN.down=false; IN.id=-1;
  if(IN.on && !IN.moved){ tapReact(IN.zone); }
  strokeHold=Math.max(strokeHold,0.20);
  try{ cv.releasePointerCapture(ev.pointerId); }catch(e){}
  if(ev.preventDefault) ev.preventDefault();
}

function tapReact(zid){
  act=null; nextIdleIn=rr(1.6,2.8);
  sinceTouch=0;
  affection=clamp(affection+0.012,0,1);
  var hv=headVirtual();
  if(zid==='muz'){
    /* boop! nose scrunch + tiny sneeze */
    P.noseTw.kick(26); doBlink(2);
    P.headLift.kick(-40); P.squash.kick(1.4);
    P.earL.kick(5.5); P.earR.kick(-5.5);
    P.tilt.kick(1.4);
    for(var i=0;i<4;i++) spawn(1, PO.muzX*P.s+P.px+rr(-14,14), PO.muzY*P.s+P.py+rr(-12,6), rr(2.5,4.5));
    startAct('shake');
  } else if(zid==='head'){
    P.lift.kick(26); doBlink(1);
    P.eyeSmile.kick(3.2); P.smile.kick(2.4);
    P.earL.kick(3.4); P.earR.kick(-3.4);
    spawn(0, hv.x+rr(-14,14), hv.y-24, rr(8,12));
    startAct('wagBurst');
  } else if(zid==='tail'){
    P.wagAmp.kick(3.2); P.wagSpd.kick(16);
    P.yaw.kick(4.0); P.lift.kick(20);
    startAct('wagBurst');
  } else if(zid==='back'){
    P.squash.kick(1.6); P.lift.kick(14);
    P.pitch.kick(1.8); P.earL.kick(2.4); P.earR.kick(-2.4);
    startAct('wagBurst');
  } else if(zid==='belly'){
    P.sit.to(1); P.pitch.kick(2.4); P.hindKick.kick(2.0);
    startAct('sitDown');
  } else if(zid==='paw'){
    var side=(IN.lx<PO.bodyX)?0:1;
    P.pawLift[side].kick(9);
    P.pitch.kick(-1.6); P.tilt.kick(side?1.2:-1.2);
    doBlink(1);
  }
}

function bindInput(){
  cv.addEventListener('pointerdown', onDown, {passive:false});
  cv.addEventListener('pointermove', onMove, {passive:false});
  cv.addEventListener('pointerup', onUp, {passive:false});
  cv.addEventListener('pointercancel', onUp, {passive:false});
  cv.addEventListener('lostpointercapture', function(){ if(IN.down){ IN.down=false; IN.id=-1; } });
  /* kill scroll / zoom / pull-to-refresh */
  var stop=function(e){ if(e.cancelable) e.preventDefault(); };
  document.addEventListener('touchstart', stop, {passive:false});
  document.addEventListener('touchmove', stop, {passive:false});
  document.addEventListener('touchend', stop, {passive:false});
  document.addEventListener('gesturestart', stop, {passive:false});
  document.addEventListener('gesturechange', stop, {passive:false});
  document.addEventListener('dblclick', stop, {passive:false});
  document.addEventListener('contextmenu', stop, {passive:false});
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });
}

/* ============================================================
   15. UI  (affection meter, hand glow)
   ============================================================ */
function drawHandGlow(c){
  var g=IN.glow.x;
  if(g<0.02) return;
  var r=52+ pet.x*16;
  var rg=c.createRadialGradient(IN.vx, IN.vy, 2, IN.vx, IN.vy, r);
  rg.addColorStop(0,'rgba(255,246,214,'+(0.30*g).toFixed(3)+')');
  rg.addColorStop(0.42,'rgba(255,238,196,'+(0.11*g).toFixed(3)+')');
  rg.addColorStop(1,'rgba(255,238,196,0)');
  c.fillStyle=rg;
  c.beginPath(); c.arc(IN.vx, IN.vy, r, 0, TAU); c.fill();
}

function drawMeter(c, dt){
  var uiY = Math.max(16, (safeT + 14 - offY)/VS);
  var uiX = VW - Math.max(14, (safeR + 12)/VS) - 82;
  var lvl = clamp(affection,0,1);
  affPulse = approach(affPulse, 0, 2.6, dt);
  var pls = 1 + affPulse*0.13 + (lvl>=0.999? 0.05*Math.sin(P.t*4.2):0);

  c.save();
  /* backing */
  c.globalAlpha=0.30; c.fillStyle='#fff8ea';
  roundRect(c, uiX, uiY, 82, 30, 15); c.fill();
  c.globalAlpha=0.18; c.strokeStyle='#7c4a2f'; c.lineWidth=1.2;
  roundRect(c, uiX, uiY, 82, 30, 15); c.stroke();
  c.globalAlpha=1;

  /* heart */
  var hx=uiX+18, hy=uiY+15;
  c.save(); c.translate(hx,hy); c.scale(pls,pls); c.translate(-hx,-hy);
  heartPath(c, hx, hy-0.5, 11, 0);
  c.fillStyle='rgba(255,255,255,0.55)'; c.fill();
  c.save();
  heartPath(c, hx, hy-0.5, 11, 0); c.clip();
  c.fillStyle=C.heart;
  c.fillRect(hx-14, hy+12 - 26*lvl, 28, 26);
  c.fillStyle='rgba(255,255,255,0.30)';
  c.fillRect(hx-14, hy+12-26*lvl, 28, 2.4);
  c.restore();
  heartPath(c, hx, hy-0.5, 11, 0);
  c.strokeStyle='rgba(150,62,74,0.75)'; c.lineWidth=1.8; c.stroke();
  c.restore();

  /* bar */
  var bx=uiX+34, by=uiY+11.5, bw=34, bh=7;
  c.fillStyle='rgba(120,66,42,0.22)';
  roundRect(c, bx, by, bw, bh, 3.5); c.fill();
  var bg=c.createLinearGradient(bx,0,bx+bw,0);
  bg.addColorStop(0,'#f6a0ac'); bg.addColorStop(1,C.heart);
  c.fillStyle=bg;
  roundRect(c, bx, by, Math.max(3.2, bw*lvl), bh, 3.5); c.fill();
  c.fillStyle='rgba(255,255,255,0.45)';
  roundRect(c, bx+1, by+1, Math.max(2, bw*lvl-2), 2.2, 1.1); c.fill();
  /* tick pips */
  c.fillStyle='rgba(120,66,42,0.20)';
  for(var i=1;i<4;i++) c.fillRect(bx+bw*i/4, by-1.5, 1, bh+3);
  c.restore();
}

/* ============================================================
   16. MAIN LOOP
   ============================================================ */
var last=0, acc=0, running=false;
function frame(now){
  if(!running) return;
  requestAnimationFrame(frame);
  if(!last) last=now;
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;     /* clamp after a stall */
  if(dt<=0) dt=1/60;

  sinceTouch += dt;
  affection = Math.max(affFloor, affection - dt*0.0075);
  if(!IN.down && strokeE<0.02 && sinceTouch>0.5){ /* idle */ }

  /* --- pose pipeline: base -> director -> petting -> springs --- */
  baseTargets(dt);
  runDirector(dt);
  applyPetting(dt);
  updateRig(dt);
  computeZones();
  updateParts(dt);

  /* --- draw --- */
  ctx.setTransform(1,0,0,1,0,0);
  if(roomCv) ctx.drawImage(roomCv, 0, 0);
  applyView(ctx);
  ctx.lineJoin='round'; ctx.lineCap='round';

  drawMotes(ctx, dt);
  drawPuppy(ctx);
  drawParts(ctx);
  drawHandGlow(ctx);

  ctx.setTransform(1,0,0,1,0,0);
  if(ovCv) ctx.drawImage(ovCv, 0, 0);
  applyView(ctx);
  drawMeter(ctx, dt);
}

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) last=0;
});

/* tiny introspection hook (used by the dev smoke test; harmless otherwise) */
window.__dbg = function(){
  return {
    aff:+affection.toFixed(3), pet:+pet.x.toFixed(3), strokeE:+strokeE.toFixed(3),
    zone:IN.zone,
    z:{h:+zHead.x.toFixed(2), b:+zBack.x.toFixed(2), l:+zBelly.x.toFixed(2),
       t:+zTail.x.toFixed(2), m:+zMuz.x.toFixed(2), p:+zPaw.x.toFixed(2)},
    yaw:+PO.yaw.toFixed(2), pitch:+PO.pitch.toFixed(2), sit:+P.sit.x.toFixed(2),
    eye:+PO.eyeOpenEff.toFixed(2), smile:+P.eyeSmile.x.toFixed(2),
    mouth:+P.mouth.x.toFixed(2), wag:+P.wagSpd.x.toFixed(2), amp:+P.wagAmp.x.toFixed(2),
    melt:+P.melt.x.toFixed(2), presses:presses.length, parts:parts.length,
    act:actName, headXY:[+PO.headX.toFixed(1), +PO.headY.toFixed(1)],
    bodyXY:[+PO.bodyX.toFixed(1), +PO.bodyY.toFixed(1)],
    muzXY:[+PO.muzX.toFixed(1), +PO.muzY.toFixed(1)],
    tailMid: PO.tailNodes[3] ? [+PO.tailNodes[3].x.toFixed(1), +PO.tailNodes[3].y.toFixed(1)] : null,
    scale:P.s, origin:[P.px,P.py]
  };
};

function boot(){
  resize();
  bindInput();
  /* settle the rig one frame so zones exist before the first input */
  updateRig(1/60); computeZones();
  P.sit.set(0);
  gaze.yaw=0.18; gaze.pitch=0.10;
  running=true;
  requestAnimationFrame(frame);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
